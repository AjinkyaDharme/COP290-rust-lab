23cs10936","src","recalculation.rs"],"content":"use crate::command::{CellRef, Command, Expr};\nuse crate::evaluator::eval_expr;\nuse crate::sheet::{CellValue, Spreadsheet};\nuse std::collections::{HashMap, HashSet};\n\n/// New type to represent a range dependency.\n#[derive(Debug, Clone, PartialEq, Eq, Hash)]\npub struct RangeRef {\n    pub start: CellRef,\n    pub end: CellRef,\n}\n\nimpl RangeRef {\n    pub fn contains(\u0026self, cell: \u0026CellRef) -\u003e bool {\n        let (s_col, s_row) = (self.start.col, self.start.row);\n        let (e_col, e_row) = (self.end.col, self.end.row);\n        let (min_col, max_col) = (s_col.min(e_col), s_col.max(e_col));\n        let (min_row, max_row) = (s_row.min(e_row), s_row.max(e_row));\n        (cell.col \u003e= min_col \u0026\u0026 cell.col \u003c= max_col) \u0026\u0026 (cell.row \u003e= min_row \u0026\u0026 cell.row \u003c= max_row)\n    }\n}\n\npub fn string_to_cell(s: \u0026str) -\u003e Option\u003cCellRef\u003e {\n    let (col_letters, row_digits) = s.split_at(s.find(|c: char| c.is_ascii_digit())?);\n    if col_letters.is_empty() || row_digits.is_empty() {\n        return None;\n    }\n    let mut col = 0;\n    for c in col_letters.chars() {\n        if !c.is_ascii_alphabetic() {\n            return None;\n        }\n        col = col * 26 + ((c.to_ascii_uppercase() as u8) - b'A' + 1) as u16;\n    }\n    let row = row_digits.parse::\u003cu16\u003e().ok()?;\n    Some(CellRef { col, row })\n}\n\npub type DependencyGraph = HashMap\u003cString, HashSet\u003cString\u003e\u003e;\n\n#[derive(Debug, Clone)]\npub struct RecalcManager {\n    pub children: DependencyGraph,\n    pub parents: DependencyGraph,\n    pub range_parents: HashMap\u003cString, HashSet\u003cRangeRef\u003e\u003e,\n    pub range_children: Vec\u003c(RangeRef, String)\u003e,\n}\nimpl Default for RecalcManager {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\nimpl RecalcManager {\n    pub fn new() -\u003e Self {\n        Self {\n            children: HashMap::new(),\n            parents: HashMap::new(),\n            range_parents: HashMap::new(),\n            range_children: Vec::new(),\n        }\n    }\n\n    pub fn update_for_command(\u0026mut self, cmd: \u0026Command) -\u003e Result\u003cVec\u003cString\u003e, String\u003e {\n        if let Command::SetCell { cell, expr } = cmd {\n            let cell_key = cell_to_string(cell);\n\n            // Extract single cell dependencies.\n            let mut new_refs = HashSet::new();\n            extract_cell_refs(expr, \u0026mut new_refs);\n\n            // Extract range dependencies.\n            let mut new_range_refs: HashSet\u003cRangeRef\u003e = HashSet::new();\n            extract_range_refs(expr, \u0026mut new_range_refs);\n\n            // Get current dependencies for this cell.\n            let old_refs = self.parents.get(\u0026cell_key).cloned().unwrap_or_default();\n            let old_range_refs = self\n                .range_parents\n                .get(\u0026cell_key)\n                .cloned()\n                .unwrap_or_default();\n\n            // Determine differences.\n            let removed = old_refs\n                .difference(\u0026new_refs)\n                .cloned()\n                .collect::\u003cHashSet\u003c_\u003e\u003e();\n            let added = new_refs\n                .difference(\u0026old_refs)\n                .cloned()\n                .collect::\u003cHashSet\u003c_\u003e\u003e();\n\n            let removed_range = old_range_refs\n                .difference(\u0026new_range_refs)\n                .cloned()\n                .collect::\u003cHashSet\u003c_\u003e\u003e();\n            let added_range = new_range_refs\n                .difference(\u0026old_range_refs)\n                .cloned()\n                .collect::\u003cHashSet\u003c_\u003e\u003e();\n\n            // Update parent's entry with new single cell dependencies.\n            self.parents.insert(cell_key.clone(), new_refs.clone());\n            // Update range_parents entry.\n            self.range_parents\n                .insert(cell_key.clone(), new_range_refs.clone());\n\n            // For removed single cell dependencies, remove cell_key from their children.\n            for dep in \u0026removed {\n                if let Some(child_set) = self.children.get_mut(dep) {\n                    child_set.remove(\u0026cell_key);\n                }\n            }\n            // For newly added single cell dependencies, add cell_key to their children.\n            for dep in \u0026added {\n                self.children\n                    .entry(dep.clone())\n                    .or_default()\n                    .insert(cell_key.clone());\n            }\n            // For removed range dependencies, remove from range_children.\n            self.range_children\n                .retain(|(range, child)| !(child == \u0026cell_key \u0026\u0026 removed_range.contains(range)));\n            // For newly added range dependencies, add to range_children.\n            for range in \u0026added_range {\n                self.range_children.push((range.clone(), cell_key.clone()));\n            }\n\n            // Attempt to compute the topological order (using both children and range_children) for affected cells.\n            match self.topological_sort_excluding(\u0026cell_key) {\n                Ok(order) =\u003e return Ok(order),\n                Err(e) =\u003e {\n                    // Roll back updates.\n                    self.parents.insert(cell_key.clone(), old_refs.clone());\n                    self.range_parents\n                        .insert(cell_key.clone(), old_range_refs.clone());\n                    for dep in \u0026added {\n                        if let Some(child_set) = self.children.get_mut(dep) {\n                            child_set.remove(\u0026cell_key);\n                        }\n                    }\n                    for dep in \u0026removed {\n                        self.children\n                            .entry(dep.clone())\n                            .or_default()\n                            .insert(cell_key.clone());\n                    }\n                    // Roll back range dependencies.\n                    self.range_children.retain(|(range, child)| {\n                        !(child == \u0026cell_key \u0026\u0026 added_range.contains(range))\n                    });\n                    // Re-add removed ranges.\n                    for range in \u0026removed_range {\n                        self.range_children.push((range.clone(), cell_key.clone()));\n                    }\n                    return Err(e);\n                }\n            }\n        }\n        Ok(Vec::new())\n    }\n\n    pub fn topological_sort_excluding(\u0026self, exclude: \u0026String) -\u003e Result\u003cVec\u003cString\u003e, String\u003e {\n        let mut fully_visited: HashSet\u003cString\u003e = HashSet::new();\n        let mut in_current_path: HashSet\u003cString\u003e = HashSet::new();\n        let mut result: Vec\u003cString\u003e = Vec::new();\n        let mut dfs_stack: Vec\u003c(String, bool)\u003e = Vec::new();\n\n        // Helper to push all dependents (both direct and via range) for a given cell key.\n        let push_dependents = |cell_key: \u0026String,\n                               stack: \u0026mut Vec\u003c(String, bool)\u003e,\n                               fully_visited: \u0026HashSet\u003cString\u003e| {\n            // Direct children.\n            if let Some(children) = self.children.get(cell_key) {\n                for child in children {\n                    if !fully_visited.contains(child) {\n                        stack.push((child.clone(), false));\n                    }\n                }\n            }\n            // Range dependencies: if cell_key can be parsed to a CellRef, then search range_children.\n            if let Some(cell_ref) = string_to_cell(cell_key) {\n                for (range, dependent) in \u0026self.range_children {\n                    // Use dependent only if not already visited.\n                    if range.contains(\u0026cell_ref) \u0026\u0026 !fully_visited.contains(dependent) {\n                        stack.push((dependent.clone(), false));\n                    }\n                }\n            }\n        };\n\n        // Start from all direct children (and those from range deps) of the updated cell.\n        push_dependents(exclude, \u0026mut dfs_stack, \u0026fully_visited);\n\n        while let Some((current, expanded)) = dfs_stack.pop() {\n            if expanded {\n                in_current_path.remove(\u0026current);\n                if !result.contains(\u0026current) {\n                    result.push(current.clone());\n                }\n                fully_visited.insert(current);\n            } else {\n                if in_current_path.contains(\u0026current) {\n                    return Err(format!(\"Cycle detected at {}\", current));\n                }\n                in_current_path.insert(current.clone());\n                dfs_stack.push((current.clone(), true));\n                push_dependents(\u0026current, \u0026mut dfs_stack, \u0026fully_visited);\n            }\n        }\n        // Reverse the result to get the correct order.\n        result.reverse();\n        result.retain(|node| node != exclude);\n        Ok(result)\n    }\n}\n\npub fn recalculate(sheet: \u0026mut Spreadsheet, topo_order: Vec\u003cString\u003e) {\n    for cell_key in topo_order {\n        if let Some(expr) = sheet.get_formula(\u0026cell_key) {\n            let result = eval_expr(expr, sheet);\n            match result {\n                Ok(val) =\u003e {\n                    if let Err(e) = sheet.set_by_key(\u0026cell_key, CellValue::Value(val)) {\n                        eprintln!(\"Error updating {}: {}\", cell_key, e);\n                    }\n                }\n                Err(_err) =\u003e {\n                    if let Err(e) = sheet.set_by_key(\u0026cell_key, CellValue::Error(())) {\n                        eprintln!(\"Error updating {}: {}\", cell_key, e);\n                    }\n                }\n            }\n        }\n    }\n}\n\n/// Recursively extract all cell references (non-range) from an expression and add them to `refs`.\npub fn extract_cell_refs(expr: \u0026Expr, refs: \u0026mut HashSet\u003cString\u003e) {\n    match expr {\n        Expr::Constant(_) =\u003e {}\n        Expr::CellRef(cell) =\u003e {\n            refs.insert(cell_to_string(cell));\n        }\n        Expr::BinaryOp(lhs, _op, rhs) =\u003e {\n            extract_cell_refs(lhs, refs);\n            extract_cell_refs(rhs, refs);\n        }\n        Expr::FunctionCall(_, arg) =\u003e {\n            extract_cell_refs(arg, refs);\n        }\n        Expr::Range(start, end) =\u003e {\n            refs.insert(cell_to_string(start));\n            refs.insert(cell_to_string(end));\n        }\n    }\n}\n\npub fn extract_range_refs(expr: \u0026Expr, range_refs: \u0026mut HashSet\u003cRangeRef\u003e) {\n    match expr {\n        Expr::Range(start, end) =\u003e {\n            range_refs.insert(RangeRef {\n                start: start.clone(),\n                end: end.clone(),\n            });\n        }\n        Expr::BinaryOp(lhs, _op, rhs) =\u003e {\n            extract_range_refs(lhs, range_refs);\n            extract_range_refs(rhs, range_refs);\n        }\n        Expr::FunctionCall(_, arg) =\u003e {\n            extract_range_refs(arg, range_refs);\n        }\n        _ =\u003e {}\n    }\n}\n\npub fn cell_to_string(cell: \u0026CellRef) -\u003e String {\n    let mut col = cell.col;\n    let mut col_str = String::new();\n    while col \u003e 0 {\n        let rem = ((col - 1) % 26) as u8;\n        col_str.insert(0, (b'A' + rem) as char);\n        col = (col - 1) / 26;\n    }\n    format!(\"{}{}\", col_str, cell.row)\n}\n","traces":[{"line":14,"address":[657712],"length":1,"stats":{"Line":1}},{"line":15,"address":[657731],"length":1,"stats":{"Lin         }\n    }\n\n    pub fn get_formula(\u0026self, key: \u0026str) -\u003e Option\u003c\u0026crate::command::Expr\u003e {\n        self.formulas.get(key)\n    }\n\n    pub fn set_formula(\u0026mut self, key: \u0026str, expr: crate::command::Expr) {\n        self.formulas.insert(key.to_string(), expr);\n    }\n\n    /// Updates a cell’s value based on its key.\n    /// This function computes the index from the key (e.g., \"A1\") and updates that cell.\n    pub fn set_by_key(\u0026mut self, key: \u0026str, value: CellValue) -\u003e Result\u003c(), String\u003e {\n        let (row, col) = Self::cell_key_to_index(key)?;\n        let idx = row * self.cols + col;\n        if idx \u003c self.cells.len() {\n            self.cells[idx] = value;\n            Ok(())\n        } else {\n            Err(format!(\"Cell {} is out of bounds\", key))\n        }\n    }\n\n    /// Helper: converts a cell key like \"A1\" to 0-based row and col indices.\n    pub fn cell_key_to_index(key: \u0026str) -\u003e Result\u003c(usize, usize), String\u003e {\n        // Split the key into the column letters and the row number.\n        let mut col_part = String::new();\n        let mut row_part = String::new();\n        for ch in key.chars() {\n            if ch.is_ascii_alphabetic() {\n                col_part.push(ch);\n            } else if ch.is_ascii_digit() {\n                row_part.push(ch);\n            } else {\n                return Err(format!(\"Invalid character in cell key: {}\", ch));\n            }\n        }\n        if col_part.is_empty() || row_part.is_empty() {\n            return Err(format!(\"Invalid cell key format: {}\", key));\n        }\n        let mut col = 0;\n        for ch in col_part.chars() {\n            col = col * 26 + (ch.to_ascii_uppercase() as usize) - ('A' as usize) + 1;\n        }\n        let row: usize = row_part\n            .parse::\u003cusize\u003e()\n            .map_err(|_| format!(\"Invalid row in cell key: {}\", key))?\n            - 1;\n        Ok((row, col - 1))\n    }\n\n    fn index(\u0026self, row: usize, col: usize) -\u003e Option\u003cusize\u003e {\n        if row \u003c self.rows \u0026\u0026 col \u003c self.cols {\n            Some(row * self.cols + col)\n        } else {\n            None\n        }\n    }\n\n    pub fn get(\u0026self, row: usize, col: usize) -\u003e Option\u003c\u0026CellValue\u003e {\n        self.index(row, col).map(|idx| \u0026self.cells[idx])\n    }\n\n    pub fn set(\u0026mut self, row: usize, col: usize, value: CellValue) -\u003e Result\u003c(), String\u003e {\n        if let Some(idx) = self.index(row, col) {\n            self.cells[idx] = value;\n            Ok(())\n        } else {\n            Err(\"Index out of bounds\".to_string())\n        }\n    }\n\n    pub fn display_spreadsheet(\u0026self, start_row: usize, start_col: usize) {\n        let end_row = (start_row + 10).min(self.rows);\n        let end_col = (start_col + 10).min(self.cols);\n\n        // Print column headers (A, B, C, ...)\n        print!(\"\\t\");\n        for col in start_col..end_col {\n            print!(\"{}\\t\", Spreadsheet::convert_to_column_name(col as u16));\n        }\n        println!();\n\n        // Print each row, starting with its 1-indexed row number.\n        for row in start_row..end_row {\n            print!(\"{}\\t\", row + 1);\n            for col in start_col..end_col {\n                let idx = row * self.cols + col;\n                let cell_display = match self.cells.get(idx) {\n                    Some(CellValue::Value(v)) =\u003e v.to_string(),\n                    Some(CellValue::Error(())) =\u003e \"ERR\".to_string(),\n                    None =\u003e \"err\".to_string(),\n                };\n                print!(\"{}\\t\", cell_display);\n            }\n            println!();\n        }\n    }\n\n    pub fn scroll_spreadsheet(\u0026mut self, direction: char) -\u003e Result\u003c(), String\u003e {\n        let display_rows = 10;\n        let display_cols = 10;\n\n        match direction {\n            'w' =\u003e {\n                if self.scroll_row \u003e= display_rows {\n                    self.scroll_row -= display_rows;\n                } else {\n                    self.scroll_row = 0;\n                }\n            }\n            's' =\u003e {\n                self.scroll_row =\n                    (self.scroll_row + display_rows).min(self.rows.saturating_sub(display_rows));\n            }\n            'a' =\u003e {\n                if self.scroll_col \u003e= display_cols {\n                    self.scroll_col -= display_cols;\n                } else {\n                    self.scroll_col = 0;\n                }\n            }\n            'd' =\u003e {\n                self.scroll_col =\n                    (self.scroll_col + display_cols).min(self.cols.saturating_sub(display_cols));\n            }\n            _ =\u003e return Err(\"Invalid direction\".to_string()),\n        }\n        Ok(())\n    }\n\n    pub fn scroll_to(\u0026mut self, cell: \u0026str) -\u003e Result\u003c(), String\u003e {\n        if let Some((row, col)) = Spreadsheet::cell_string_to_indices(cell) {\n            if row \u003c self.rows \u0026\u0026 col \u003c self.cols {\n                self.scroll_row = row;\n                self.scroll_col = col;\n                Ok(())\n            } else {\n                Err(\"Cell reference out of bounds\".to_string())\n            }\n        } else {\n            Err(\"Invalid cell reference format\".to_string())\n        }\n    }\n\n    pub fn cell_string_to_indices(cell: \u0026str) -\u003e Option\u003c(usize, usize)\u003e {\n        if cell.is_empty() || !cell.chars().next()?.is_alphabetic() {\n            return None;\n        }\n\n        let mut col = 0usize;\n        let mut i = 0;\n        let chars: Vec\u003cchar\u003e = cell.chars().collect();\n\n        while i \u003c chars.len() \u0026\u0026 chars[i].is_alphabetic() {\n            col = col * 26 + (chars[i].to_ascii_uppercase() as usize - 'A' as usize + 1);\n            i += 1;\n        }\n\n        if col == 0 || i == chars.len() || !chars[i].is_ascii_digit() {\n            return None;\n        }\n\n        let mut row = 0usize;\n        while i \u003c chars.len() \u0026\u0026 chars[i].is_ascii_digit() {\n            row = row * 10 + (chars[i] as usize - '0' as usize);\n            i += 1;\n        }\n\n        if i != chars.len() {\n            return None;\n        }\n\n        Some((row - 1, col - 1))\n    }\n\n    pub fn convert_to_column_name(mut col: u16) -\u003e String {\n        let mut name = String::new();\n        loop {\n            let rem = col % 26;\n            name.insert(0, (b'A' + rem as u8) as char);\n            if col \u003c 26 {\n                break;\n            }\n            col = (col / 26) - 1;\n        }\n        name\n    }\n}\n","traces":[{"line":10,"address":[163264],"length":1,"stats":{"Line":14}},{"line":24,"address":[569686,569376],"length":1,"stats":{"Line":14}},{"line":25,"address":[525274,525385],"length":1,"stats":{"Line":14}},{"line":30,"address":[163433],"length":1,"stats":{"Line":14}},{"line":36,"address":[158960],"length":1,"stats":{"Line":5}},{"line":37,"address":[569730],"length":1,"stats":{"Line":5}},{"line":40,"address":[525616,525811,525786],"length":1,"stats":{"Line":4}},{"line":41,"address":[694226,694154],"length":1,"stats":{"Line":8}},{"line":46,"address":[694336],"length":1,"stats":{"Line":2}},{"line":47,"address":[526032,525890],"length":1,"stats":{"Line":2}},{"line":48,"address":[570155,570316,570245],"length":1,"stats":{"Line":4}},{"line":49,"address":[694889,694660],"length":1,"stats":{"Line":4}},{"line":50,"address":[159743],"length":1,"stats":{"Line":2}},{"line":51,"address":[570566],"length":1,"stats":{"Line":2}},{"line":53,"address":[570486,570332],"length":1,"stats":{"Line":4}},{"line":58,"address":[694960,696793],"length":1,"stats":{"Line":5}},{"line":60,"address":[623663],"length":1,"stats":{"Line":5}},{"line":61,"address":[164524], Line":2}},{"line":212,"address":[166353],"length":1,"stats":{"Line":2}},{"line":213,"address":[170784],"length":1,"stats":{"Line":2}},{"line":214,"address":[577037],"length":1,"stats":{"Line":2}},{"line":215,"address":[166250],"length":1,"stats":{"Line":2}},{"line":218,"address":[166316,166358,166258],"length":1,"stats":{"Line":4}},{"line":220,"address":[166280],"length":1,"stats":{"Line":2}}],"covered":109,"coverable":112},{"path":["/","home","ajinkya486","lab4_2023cs10936","lab2_2023cs10936","tests","evaluator_test.rs"],"content":"use spreadsheet::command::{BinaryOp, CellRef, Command, Expr, Function};\nuse spreadsheet::evaluator::{EvalError, convert_col_to_name, eval_expr, evaluate_command};\nuse spreadsheet::sheet::{CellValue, Spreadsheet};\nuse std::time::{Duration, Instant};\n\n#[test]\nfn test_eval_constant() {\n    let sheet = Spreadsheet::new(5, 5);\n    let expr = Expr::Constant(42);\n\n    let result = eval_expr(\u0026expr, \u0026sheet);\n    assert!(result.is_ok());\n    assert_eq!(result.unwrap(), 42);\n}\n\n#[test]\nfn test_eval_cell_ref() {\n    let mut sheet = Spreadsheet::new(5, 5);\n    sheet.set(0, 0, CellValue::Value(10)).unwrap();\n\n    let expr = Expr::CellRef(CellRef { row: 1, col: 1 });\n\n    let result = eval_expr(\u0026expr, \u0026sheet);\n    assert!(result.is_ok());\n    assert_eq!(result.unwrap(), 10);\n}\n\n#[test]\nfn test_eval_binary_op() {\n    let sheet = Spreadsheet::new(5, 5);\n\n    // Test addition: 10 + 5\n    let expr = Expr::BinaryOp(\n        Box::new(Expr::Constant(10)),\n        BinaryOp::Add,\n        Box::new(Expr::Constant(5)),\n    );\n\n    let result = eval_expr(\u0026expr, \u0026sheet);\n    assert!(result.is_ok());\n    assert_eq!(result.unwrap(), 15);\n\n    // Test multiplication: 10 * 5\n    let expr = Expr::BinaryOp(\n        Box::new(Expr::Constant(10)),\n        BinaryOp::Multiply,\n        Box::new(Expr::Constant(5)),\n    );\n\n    let result = eval_expr(\u0026expr, \u0026sheet);\n    assert!(result.is_ok());\n    assert_eq!(result.unwrap(), 50);\n\n    // Test division by zero\n    let expr = Expr::BinaryOp(\n        Box::new(Expr::Constant(10)),\n        BinaryOp::Divide,\n        Box::new(Expr::Constant(0)),\n    );\n\n    let result = eval_expr(\u0026expr, \u0026sheet);\n    assert!(result.is_err());\n    assert!(matches!(result.unwrap_err(), EvalError::DivByZero));\n}\n\n#[test]\nfn test_eval_function_call() {\n    let mut sheet = Spreadsheet::new(5, 5);\n\n    // Set up a 2x2 range of cells\n    sheet.set(0, 0, CellValue::Value(10)).unwrap();\n    sheet.set(0, 1, CellValue::Value(20)).unwrap();\n    sheet.set(1, 0, CellValue::Value(30)).unwrap();\n    sheet.set(1, 1, CellValue::Value(40)).unwrap();\n\n    // Test SUM function\n    let expr = Expr::FunctionCall(\n        Function::Sum,\n        Box::new(Expr::Range(\n            CellRef { row: 1, col: 1 },\n            CellRef { row: 2, col: 2 },\n        )),\n    );\n\n    let result = eval_expr(\u0026expr, \u0026sheet);\n    assert!(result.is_ok());\n    assert_eq!(result.unwrap(), 100); // 10 + 20 + 30 + 40 = 100\n\n    // Test MAX function\n    let expr = Expr::FunctionCall(\n        Function::Max,\n        Box::new(Expr::Range(\n            CellRef { row: 1, col: 1 },\n            CellRef { row: 2, col: 2 },\n        )),\n    );\n\n    let result = eval_expr(\u0026expr, \u0026sheet);\n    assert!(result.is_ok());\n    assert_eq!(result.unwrap(), 40);\n\n    // Test AVG function\n    let expr = Expr::FunctionCall(\n        Function::Avg,\n        Box::new(Expr::Range(\n            CellRef { row: 1, col: 1 },\n            CellRef { row: 2, col: 2 },\n        )),\n    );\n\n    let result = eval_expr(\u0026expr, \u0026sheet);\n    assert!(result.is_ok());\n    assert_eq!(result.unwrap(), 25); // (10 + 20 + 30 + 40) / 4 = 25\n}\n\n#[test]\nfn test_error_propagation() {\n    let mut sheet = Spreadsheet::new(5, 5);\n\n    // Set a cell to Error\n    sheet.set(0, 0, CellValue::Error(())).unwrap();\n\n    // Reference the error cell\n    let expr = Expr::CellRef(CellRef { row: 1, col: 1 });\n\n    let result = eval_expr(\u0026expr, \u0026sheet);\n    assert!(result.is_err());\n    assert!(matches!(result.unwrap_err(), EvalError::CellError));\n\n    // Reference a cell out of bounds\n    let expr = Expr::CellRef(CellRef { row: 10, col: 10 });\n\n    let result = eval_expr(\u0026expr, \u0026sheet);\n    assert!(result.is_err());\n    assert!(matches!(result.unwrap_err(), EvalError::OutOfBounds));\n}\n\n#[test]\nfn test_subtraction_and_division() {\n    let sheet = Spreadsheet::new(5, 5);\n\n    // Test subtraction: 10 - 5\n    let expr = Expr::BinaryOp(\n        Box::new(Expr::Constant(10)),\n        BinaryOp::Subtract,\n        Box::new(Expr::Constant(5)),\n    );\n\n    let result = eval_expr(\u0026expr, \u0026sheet);\n    assert!(result.is_ok());\n    assert_eq!(result.unwrap(), 5);\n\n    // Test division: 10 / 5\n    let expr = Expr::BinaryOp(\n        Box::new(Expr::Constant(10)),\n        BinaryOp::Divide,\n        Box::new(Expr::Constant(5)),\n    );\n\n    let result = eval_expr(\u0026expr, \u0026sheet);\n    assert!(result.is_ok());\n    assert_eq!(result.unwrap(), 2);\n}\n\n#[test]\nfn test_nested_binary_operations() {\n    let sheet = Spreadsheet::new(5, 5);\n\n    // Test (10 + 5) * 2\n    let expr = Expr::BinaryOp(\n        Box::new(Expr::BinaryOp(\n            Box::new(Expr::Constant(10)),\n            BinaryOp::Add,\n            Box::new(Expr::Constant(5)),\n        )),\n        BinaryOp::Multiply,\n        Box::new(Expr::Constant(2)),\n    );\n\n    let result = eval_expr(\u0026expr, \u0026sheet);\n    assert!(result.is_ok());\n    assert_eq!(result.unwrap(), 30);\n\n    // Test 10 + (5 * 2)\n    let expr = Expr::BinaryOp(\n        Box::new(Expr::Constant(10)),\n        BinaryOp::Add,\n        Box::new(Expr::BinaryOp(\n            Box::new(Expr::Constant(5)),\n            BinaryOp::Multiply,\n            Box::new(Expr::Constant(2)),\n        )),\n    );\n\n    let result = eval_expr(\u0026expr, \u0026sheet);\n    assert!(result.is_ok());\n    assert_eq!(result.unwrap(), 20);\n}\n\n#[test]\nfn test_min_function() {\n    let mut sheet = Spreadsheet::new(5, 5);\n\n    // Set up a range of cells with different values\n    sheet.set(0, 0, CellValue::Value(10)).unwrap();\n    sheet.set(0, 1, CellValue::Value(5)).unwrap();\n    sheet.set(1, 0, CellValue::Value(30)).unwrap();\n    sheet.set(1, 1, CellValue::Value(15)).unwrap();\n\n    // Test MIN function\n    let expr = Expr::FunctionCall(\n        Function::Min,\n        Box::new(Expr::Range(\n            CellRef { row: 1, col: 1 },\n            CellRef { row: 2, col: 2 },\n        )),\n    );\n\n    let result = eval_expr(\u0026expr, \u0026sheet);\n    assert!(result.is_ok());\n    assert_eq!(result.unwrap(), 5);\n}\n\n#[test]\nfn test_stdev_function() {\n    let mut sheet = Spreadsheet::new(5, 5);\n\n    // Set up a range of cells\n    sheet.set(0, 0, CellValue::Value(10)).unwrap();\n    sheet.set(0, 1, CellValue::Value(10)).unwrap();\n    sheet.set(1, 0, CellValue::Value(10)).unwrap();\n    sheet.set(1, 1, CellValue::Value(10)).unwrap();\n\n    // Test STDEV function with all same values (should be 0)\n    let expr = Expr::FunctionCall(\n        Function::Stdev,\n        Box::new(Expr::Range(\n            CellRef { row: 1, col: 1 },\n            CellRef { row: 2, col: 2 },\n        )),\n    );\n\n    let result = eval_expr(\u0026expr, \u0026sheet);\n    assert!(result.is_ok());\n    assert_eq!(result.unwrap(), 0);\n\n    // Change values to get non-zero standard deviation\n    sheet.set(0, 0, CellValue::Value(2)).unwrap();\n    sheet.set(0, 1, CellValue::Value(4)).unwrap();\n    sheet.set(1, 0, CellValue::Value(6)).unwrap();\n    sheet.set(1, 1, CellValue::Value(8)).unwrap();\n\n    let result = eval_expr(\u0026expr, \u0026sheet);\n    assert!(result.is_ok());\n    assert_eq!(result.unwrap(), 2); // Simple case with predictable output\n}\n\n#[test]\nfn test_sleep_function() {\n    let sheet = Spreadsheet::new(5, 5);\n\n    // Test SLEEP function with a small duration (1 second)\n    let expr = Expr::FunctionCall(Function::Sleep, Box::new(Expr::Constant(1)));\n\n    let start = Instant::now();\n    let result = eval_expr(\u0026expr, \u0026sheet);\n    let elapsed = start.elapsed();\n\n    assert!(result.is_ok());\n    assert_eq!(result.unwrap(), 1);\n    assert!(elapsed \u003e= Duration::from_secs(1));\n}\n\n#[test]\nfn test_function_error_cases() {\n    let sheet = Spreadsheet::new(5, 5);\n\n    // Test function with invalid range (end before start)\n    let expr = Expr::FunctionCall(\n        Function::Sum,\n        Box::new(Expr::Range(\n            CellRef { row: 3, col: 3 },\n            CellRef { row: 1, col: 1 },\n        )),\n    );\n\n    let result = eval_expr(\u0026expr, \u0026sheet);\n    assert!(result.is_err());\n    assert!(matches!(result.unwrap_err(), EvalError::Other(_)));\n\n    // Test function with non-range argument\n    let expr = Expr::FunctionCall(Function::Sum, Box::new(Expr::Constant(10)));\n\n    let result = eval_expr(\u0026expr, \u0026sheet);\n    assert!(result.is_err());\n    assert!(matches!(result.unwrap_err(), EvalError::Other(_)));\n\n    // Test range expression directly (not as function argument)\n    let expr = Expr::Range(CellRef { row: 1, col: 1 }, CellRef { row: 2, col: 2 });\n\n    let result = eval_expr(\u0026expr, \u0026sheet);\n    assert!(result.is_err());\n    assert!(matches!(result.unwrap_err(), EvalError::Other(_)));\n}\n\n#[test]\nfn test_evaluate_command_set_cell() {\n    let mut sheet = Spreadsheet::new(5, 5);\n    let mut output_enabled = true;\n\n    // Set cell A1 to constant 42\n    let cmd = Command::SetCell {\n        cell: CellRef { row: 1, col: 1 },\n        expr: Expr::Constant(42),\n    };\n\n    let result = evaluate_command(cmd, \u0026mut sheet, \u0026mut output_enabled);\n    assert!(result.is_ok());\n\n    // Check that the cell was set correctly\n    assert_eq!(*sheet.get(0, 0).unwrap(), CellValue::Value(42));\n}\n\n#[test]\nfn test_evaluate_command_set_cell_with_error() {\n    let mut sheet = Spreadsheet::new(5, 5);\n    let mut output_enabled = true;\n\n    // Set cell A1 with a division by zero error\n    let cmd = Command::SetCell {\n        cell: CellRef { row: 1, col: 1 },\n        expr: Expr::BinaryOp(\n            Box::new(Expr::Constant(10)),\n            BinaryOp::Divide,\n            Box::new(Expr::Constant(0)),\n        ),\n    };\n\n    let result = evaluate_command(cmd, \u0026mut sheet, \u0026mut output_enabled);\n    assert!(result.is_ok()); // The command itself succeeds, setting the cell to error\n\n    // Check that the cell was set to error\n    assert!(matches!(sheet.get(0, 0).unwrap(), CellValue::Error(_)));\n}\n\n#[test]\nfn test_evaluate_command_output_control() {\n    let mut sheet = Spreadsheet::new(5, 5);\n    let mut output_enabled = true;\n\n    // Disable output\n    let cmd = Command::DisableOutput;\n    let result = evaluate_command(cmd, \u0026mut sheet, \u0026mut output_enabled);\n    assert!(result.is_ok());\n    assert_eq!(output_enabled, false);\n\n    // Enable output\n    let cmd = Command::EnableOutput;\n    let result = evaluate_command(cmd, \u0026mut sheet, \u0026mut output_enabled);\n    assert!(result.is_ok());\n    assert_eq!(output_enabled, true);\n}\n\n#[test]\nfn test_convert_col_to_name() {\n    assert_eq!(convert_col_to_name(1), \"A\");\n    assert_eq!(convert_col_to_name(26), \"Z\");\n    assert_eq!(convert_col_to_name(27), \"AA\");\n    assert_eq!(convert_col_to_name(52), \"AZ\");\n    assert_eq!(convert_col_to_name(53), \"BA\");\n    assert_eq!(convert_col_to_name(702), \"ZZ\");\n    assert_eq!(convert_col_to_name(703), \"AAA\");\n}\n\n#[test]\nfn test_evaluate_command_scrolling() {\n    let mut sheet = Spreadsheet::new(20, 20);\n    let mut output_enabled = true;\n\n    // Test scrolling commands (can only verify they don't error)\n    let commands = [\n        Command::ScrollUp,\n        Command::ScrollDown,\n        Command::ScrollLeft,\n        Command::ScrollRight,\n        Command::ScrollTo(CellRef { row: 5, col: 5 }),\n    ];\n\n    for cmd in commands {\n        let result = evaluate_command(cmd, \u0026mut sheet, \u0026mut output_enabled);\n        assert!(result.is_ok());\n    }\n}\n\n#[test]\nfn test_evaluate_command_set_cell_with_cell_error() {\n    let mut sheet = Spreadsheet::new(5, 5);\n    let mut output_enabled = true;\n\n    // First set a cell to error\n    sheet.set(0, 0, CellValue::Error(())).unwrap();\n\n    // Then try to use that cell in another expression\n    let cmd = Command::SetCell {\n        cell: CellRef { row: 2, col: 2 },\n        expr: Expr::CellRef(CellRef { row: 1, col: 1 }),\n    };\n\n    let result = evaluate_command(cmd, \u0026mut sheet, \u0026mut output_enabled);\n    assert!(result.is_ok()); // The command succeeds, setting the target cell to error\n\n    // Check that the target cell was set to error\n    assert!(matches!(sheet.get(1, 1).unwrap(), CellValue::Error(_)));\n}\n\n#[test]\nfn test_evaluate_command_set_cell_with_out_of_bounds() {\n    let mut sheet = Spreadsheet::new(5, 5);\n    let mut output_enabled = true;\n\n    // Set a cell with a reference to an out-of-bounds cell\n    let cmd = Command::SetCell {\n        cell: CellRef { row: 2, col: 2 },\n        expr: Expr::CellRef(CellRef { row: 10, col: 10 }),\n    };\n\n    let result = evaluate_command(cmd, \u0026mut sheet, \u0026mut output_enabled);\n    assert!(result.is_err());\n    assert!(matches!(result.unwrap_err(), EvalError::OutOfBounds));\n\n    // Check that the target cell was set to error\n    assert!(matches!(sheet.get(1, 1).unwrap(), CellValue::Error(_)));\n}\n\n#[test]\nfn test_evaluate_command_set_cell_with_other_error() {\n    let mut sheet = Spreadsheet::new(5, 5);\n    let mut output_enabled = true;\n\n    // Set a cell with an invalid range expression\n    let cmd = Command::SetCell {\n        cell: CellRef { row: 2, col: 2 },\n        expr: Expr::Range(CellRef { row: 3, col: 3 }, CellRef { row: 1, col: 1 }),\n    };\n\n    let result = evaluate_command(cmd, \u0026mut sheet, \u0026mut output_enabled);\n    assert!(result.is_err());\n\n    // Check that the target cell was set to error\n    assert!(matches!(sheet.get(1, 1).unwrap(), CellValue::Error(_)));\n}\n\n#[test]\nfn test_empty_range_functions() {\n    let sheet = Spreadsheet::new(5, 5);\n\n    // Create an empty range by using an invalid range (which returns an error)\n    for func in [\n        Function::Sum,\n        Function::Min,\n        Function::Max,\n        Function::Avg,\n        Function::Stdev,\n    ] {\n        let expr = Expr::FunctionCall(\n            func,\n            Box::new(Expr::Range(\n                CellRef { row: 1, col: 1 },\n                CellRef { row: 0, col: 0 }, // Invalid range\n            )),\n        );\n\n        let result = eval_expr(\u0026expr, \u0026sheet);\n        assert!(result.is_err());\n    }\n}\n\n#[test]\nfn test_stdev_with_single_value() {\n    let mut sheet = Spreadsheet::new(5, 5);\n    sheet.set(0, 0, CellValue::Value(42)).unwrap();\n\n    // Test STDEV with single value (should be 0)\n    let expr = Expr::FunctionCall(\n        Function::Stdev,\n        Box::new(Expr::Range(\n            CellRef { row: 1, col: 1 },\n            CellRef { row: 1, col: 1 },\n        )),\n    );\n\n    let result = eval_expr(\u0026expr, \u0026sheet);\n    assert!(result.is_ok());\n    assert_eq!(result.unwrap(), 0);\n}\n\n#[test]\nfn test_quit_command() {\n    let mut sheet = Spreadsheet::new(5, 5);\n    let mut output_enabled = true;\n\n    // Just ensure Quit command doesn't panic\n    let cmd = Command::Quit;\n    let result = evaluate_command(cmd, \u0026mut sheet, \u0026mut output_enabled);\n    assert!(result.is_ok());\n}\n\n#[test]\nfn test_formula_storage() {\n    let mut sheet = Spreadsheet::new(5, 5);\n    let mut output_enabled = true;\n\n    // Set a cell with a formula\n    let expr = Expr::BinaryOp(\n        Box::new(Expr::Constant(10)),\n        BinaryOp::Add,\n        Box::new(Expr::Constant(20)),\n    );\n\n    let cmd = Command::SetCell {\n        cell: CellRef { row: 1, col: 1 },\n        expr: expr.clone(),\n    };\n\n    evaluate_command(cmd, \u0026mut sheet, \u0026mut output_enabled).unwrap();\n\n    // Verify the formula was stored\n    let key = format!(\"A1\");\n    assert!(sheet.get_formula(\u0026key).is_some());\n\n    // This doesn't compare the actual formulas, just verifies storage\n    assert_eq!(*sheet.get_formula(\u0026key).unwrap(), expr);\n}\n\n#[test]\nfn test_eval_expr_error_display() {\n    assert_eq!(EvalError::DivByZero.to_string(), \"Division by zero\");\n    assert_eq!(EvalError::CellError.to_string(), \"Referenced cell error\");\n    assert_eq!(\n        EvalError::OutOfBounds.to_string(),\n        \"Cell reference out of bounds\"\n    );\n    assert_eq!(\n        EvalError::Other(\"Test error\".into()).to_string(),\n        \"Test error\"\n    );\n}\n\n#[test]\nfn test_stdev_advanced_cases() {\n    let mut sheet = Spreadsheet::new(5, 5);\n\n    // Testing the specific stdev formula with known values\n    // Since sheet is 0-indexed but CellRef is 1-indexed:\n    sheet.set(0, 0, CellValue::Value(5)).unwrap(); // A1\n    sheet.set(0, 1, CellValue::Value(10)).unwrap(); // B1\n    sheet.set(1, 0, CellValue::Value(15)).unwrap(); // A2\n    sheet.set(1, 1, CellValue::Value(20)).unwrap(); // B2\n\n    // Range from A1 to B2\n    let expr = Expr::FunctionCall(\n        Function::Stdev,\n        Box::new(Expr::Range(\n            CellRef { row: 1, col: 1 }, // A1\n            CellRef { row: 2, col: 2 }, // B2\n        )),\n    );\n\n    let result = eval_expr(\u0026expr, \u0026sheet);\n    assert!(result.is_ok());\n    assert_eq!(result.unwrap(), 6);\n}\n\n#[test]\nfn test_function_call_with_non_range_arg() {\n    let sheet = Spreadsheet::new(5, 5);\n\n    // Test functions that require range with a non-range argument\n    for func in [\n        Function::Sum,\n        Function::Min,\n        Function::Max,\n        Function::Avg,\n        Function::Stdev,\n    ] {\n        let expr = Expr::FunctionCall(func, Box::new(Expr::Constant(42)));\n\n        let result = eval_expr(\u0026expr, \u0026sheet);\n        assert!(result.is_err());\n        let err = result.unwrap_err();\n        match err {\n            EvalError::Other(msg) =\u003e {\n                assert!(msg.contains(\"requires a range argument\"));\n            }\n            _ =\u003e panic!(\"Expected Other error, got {:?}\", err),\n        }\n    }\n}\n\n#[test]\nfn test_set_cell_division_by_zero() {\n    let mut sheet = Spreadsheet::new(5, 5);\n    let mut output_enabled = true;\n\n    // Set cell with division by zero - should set cell to error but not return error\n    let cmd = Command::SetCell {\n        cell: CellRef { row: 1, col: 1 },\n        expr: Expr::BinaryOp(\n            Box::new(Expr::Constant(10)),\n            BinaryOp::Divide,\n            Box::new(Expr::Constant(0)),\n        ),\n    };\n\n    let result = evaluate_command(cmd, \u0026mut sheet, \u0026mut output_enabled);\n    assert!(result.is_ok()); // Command should succeed\n\n    // Cell should be set to error\n    assert!(matches!(sheet.get(0, 0).unwrap(), CellValue::Error(_)));\n}\n\n#[test]\nfn test_set_cell_cell_error() {\n    let mut sheet = Spreadsheet::new(5, 5);\n    let mut output_enabled = true;\n\n    // First set a cell to error\n    sheet.set(0, 0, CellValue::Error(())).unwrap();\n\n    // Set a cell referencing the error cell\n    let cmd = Command::SetCell {\n        cell: CellRef { row: 2, col: 2 },\n        expr: Expr::CellRef(CellRef { row: 1, col: 1 }),\n    };\n\n    let result = evaluate_command(cmd, \u0026mut sheet, \u0026mut output_enabled);\n    assert!(result.is_ok()); // Command should succeed\n\n    // Cell should be set to error\n    assert!(matches!(sheet.get(1, 1).unwrap(), CellValue::Error(_)));\n}\n\n#[test]\nfn test_set_cell_with_invalid_range() {\n    let mut sheet = Spreadsheet::new(5, 5);\n    let mut output_enabled = true;\n\n    // Set cell with an invalid range in function\n    let cmd = Command::SetCell {\n        cell: CellRef { row: 1, col: 1 },\n        expr: Expr::FunctionCall(\n            Function::Sum,\n            Box::new(Expr::Range(\n                CellRef { row: 3, col: 3 },\n                CellRef { row: 1, col: 1 },\n            )),\n        ),\n    };\n\n    let result = evaluate_command(cmd, \u0026mut sheet, \u0026mut output_enabled);\n    assert!(result.is_err());\n\n    // Cell should be set to error\n    assert!(matches!(sheet.get(0, 0).unwrap(), CellValue::Error(_)));\n}\n\n#[test]\nfn test_formula_storage_update() {\n    let mut sheet = Spreadsheet::new(5, 5);\n    let mut output_enabled = true;\n\n    // Set a cell formula\n    let expr1 = Expr::Constant(10);\n    let cmd = Command::SetCell {\n        cell: CellRef { row: 1, col: 1 },\n        expr: expr1.clone(),\n    };\n\n    evaluate_command(cmd, \u0026mut sheet, \u0026mut output_enabled).unwrap();\n\n    // Update the same cell with new formula\n    let expr2 = Expr::Constant(20);\n    let cmd = Command::SetCell {\n        cell: CellRef { row: 1, col: 1 },\n        expr: expr2.clone(),\n    };\n\n    evaluate_command(cmd, \u0026mut sheet, \u0026mut output_enabled).unwrap();\n\n    // Verify the formula was updated\n    let key = format!(\"A1\");\n    assert_eq!(*sheet.get_formula(\u0026key).unwrap(), expr2);\n    assert_ne!(*sheet.get_formula(\u0026key).unwrap(), expr1);\n}\n\n#[test]\nfn test_function_not_implemented() {\n    let sheet = Spreadsheet::new(5, 5);\n\n    // Create a fake function call that would trigger the default case\n    // (this is a bit of a hack since our real code doesn't have this case)\n    let expr = Expr::FunctionCall(\n        Function::Sleep,\n        Box::new(Expr::Range(\n            CellRef { row: 1, col: 1 },\n            CellRef { row: 2, col: 2 },\n        )),\n    );\n\n    // Check that it errors properly\n    let result = eval_expr(\u0026expr, \u0026sheet);\n    assert!(result.is_err());\n}\n\n#[test]\nfn test_scroll_methods_error_handling() {\n    let mut sheet = Spreadsheet::new(5, 5);\n    let mut output_enabled = true;\n\n    // Create a Sheet mock that would return errors for scroll operations\n    // For demonstration purposes only - in real test we'd need to mock the sheet\n\n    // Test ScrollTo with invalid reference\n    let cmd = Command::ScrollTo(CellRef {\n        row: 1000,\n        col: 1000,\n    });\n    let result = evaluate_command(cmd, \u0026mut sheet, \u0026mut output_enabled);\n\n    // This might pass if your sheet handles out-of-range scrolling gracefully\n    // The key is that we're testing the error propagation path in the evaluate_command function\n    assert!(result.is_ok() || matches!(result, Err(EvalError::Other(_))));\n}\n\n#[test]\nfn test_quit_command_coverage() {\n    let mut sheet = Spreadsheet::new(5, 5);\n    let mut output_enabled = true;\n\n    let cmd = Command::Quit;\n    let result = evaluate_command(cmd, \u0026mut sheet, \u0026mut output_enabled);\n\n    // Just verifying it returns Ok\n    assert!(result.is_ok());\n}\n\n#[test]\nfn test_convert_col_to_name_edge_cases() {\n    // Test with larger values\n    assert_eq!(convert_col_to_name(27), \"AA\");\n    assert_eq!(convert_col_to_name(28), \"AB\");\n    assert_eq!(convert_col_to_name(52), \"AZ\");\n    assert_eq!(convert_col_to_name(53), \"BA\");\n    assert_eq!(convert_col_to_name(702), \"ZZ\");\n    assert_eq!(convert_col_to_name(703), \"AAA\");\n    assert_eq!(convert_col_to_name(1000), \"ALL\");\n    assert_eq!(convert_col_to_name(18278), \"ZZZ\");\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ajinkya486","lab4_2023cs10936","lab2_2023cs10936","tests","parse_test.rs"],"content":"use spreadsheet::command::{BinaryOp, Command, Expr, Function};\nuse spreadsheet::parser;\n\n#[test]\nfn test_parse_command_quit() {\n    let result = parser::parse_command(\"q\");\n    assert!(result.is_ok());\n\n    let (_, command) = result.unwrap();\n    match command {\n        Command::Quit =\u003e {}\n        _ =\u003e panic!(\"Expected Quit command\"),\n    }\n}\n\n#[test]\nfn test_parse_scroll_commands() {\n    // Test scroll directions\n    for cmd in \u0026[\"w\", \"a\", \"s\", \"d\"] {\n        let result = parser::parse_command(cmd);\n        assert!(result.is_ok());\n\n        let (_, command) = result.unwrap();\n        match command {\n            Command::ScrollUp\n            | Command::ScrollDown\n            | Command::ScrollLeft\n            | Command::ScrollRight =\u003e {}\n            _ =\u003e panic!(\"Expected scroll command\"),\n        }\n    }\n\n    // Test scroll_to\n    let result = parser::parse_command(\"scroll_to A1\");\n    assert!(result.is_ok());\n\n    let (_, command) = result.unwrap();\n    match command {\n        Command::ScrollTo(_) =\u003e {}\n        _ =\u003e panic!(\"Expected ScrollTo command\"),\n    }\n}\n\n#[test]\nfn test_parse_simple_formula() {\n    let result = parser::parse_command(\"A1=42\");\n    assert!(result.is_ok());\n\n    let (_, command) = result.unwrap();\n    match command {\n        Command::SetCell { cell, expr } =\u003e {\n            assert_eq!(cell.row, 1);\n            assert_eq!(cell.col, 1);\n\n            match expr {\n                Expr::Constant(val) =\u003e assert_eq!(val, 42),\n                _ =\u003e panic!(\"Expected constant expression\"),\n            }\n        }\n        _ =\u003e panic!(\"Expected SetCell command\"),\n    }\n}\n\n#[test]\nfn test_parse_complex_formula() {\n    let result = parser::parse_command(\"B2=A1+5*C3\");\n    assert!(result.is_ok());\n\n    let (_, command) = result.unwrap();\n    match command {\n        Command::SetCell { cell, expr } =\u003e {\n            assert_eq!(cell.row, 2);\n            assert_eq!(cell.col, 2);\n\n            // Check that expr is a binary operation (addition)\n            match expr {\n                Expr::BinaryOp(_, op, _) =\u003e {\n                    assert!(matches!(op, BinaryOp::Add));\n                    // Further checks for operands could be added\n                }\n                _ =\u003e panic!(\"Expected binary operation\"),\n            }\n        }\n        _ =\u003e panic!(\"Expected SetCell command\"),\n    }\n}\n\n#[test]\nfn test_parse_function_call() {\n    let result = parser::parse_command(\"C3=SUM(A1:B2)\");\n    assert!(result.is_ok());\n\n    let (_, command) = result.unwrap();\n    match command {\n        Command::SetCell { cell, expr } =\u003e {\n            assert_eq!(cell.row, 3);\n            assert_eq!(cell.col, 3);\n\n            match expr {\n                Expr::FunctionCall(func, _) =\u003e {\n                    assert!(matches!(func, Function::Sum));\n                }\n                _ =\u003e panic!(\"Expected function call\"),\n            }\n        }\n        _ =\u003e panic!(\"Expected SetCell command\"),\n    }\n}\n\n#[test]\nfn test_disable_output() {\n    let result = parser::parse_command(\"disable_output\");\n    assert!(result.is_ok());\n\n    let (_, command) = result.unwrap();\n    match command {\n        Command::DisableOutput =\u003e {}\n        _ =\u003e panic!(\"Expected DisableOutput command\"),\n    }\n}\n\n#[test]\nfn test_enable_output() {\n    let result = parser::parse_command(\"enable_output\");\n    assert!(result.is_ok());\n\n    let (_, command) = result.unwrap();\n    match command {\n        Command::EnableOutput =\u003e {}\n        _ =\u003e panic!(\"Expected EnableOutput command\"),\n    }\n}\n\n#[test]\nfn test_negative_constant() {\n    let result = parser::parse_command(\"A1=-42\");\n    assert!(result.is_ok());\n\n    let (_, command) = result.unwrap();\n    match command {\n        Command::SetCell { cell, expr } =\u003e {\n            assert_eq!(cell.row, 1);\n            assert_eq!(cell.col, 1);\n\n            match expr {\n                Expr::Constant(val) =\u003e assert_eq!(val, -42),\n                _ =\u003e panic!(\"Expected negative constant expression\"),\n            }\n        }\n        _ =\u003e panic!(\"Expected SetCell command\"),\n    }\n}\n\n#[test]\nfn test_parse_parenthesized_expr() {\n    let result = parser::parse_command(\"A1=(2+3)*4\");\n    assert!(result.is_ok());\n\n    let (_, command) = result.unwrap();\n    match command {\n        Command::SetCell { cell: _, expr } =\u003e match expr {\n            Expr::BinaryOp(_, BinaryOp::Multiply, _) =\u003e {}\n            _ =\u003e panic!(\"Expected parenthesized expression\"),\n        },\n        _ =\u003e panic!(\"Expected SetCell command\"),\n    }\n}\n\n#[test]\nfn test_parse_cell_ref_expr() {\n    let result = parser::parse_command(\"A1=B2\");\n    assert!(result.is_ok());\n\n    let (_, command) = result.unwrap();\n    match command {\n        Command::SetCell { cell, expr } =\u003e {\n            assert_eq!(cell.row, 1);\n            assert_eq!(cell.col, 1);\n\n            match expr {\n                Expr::CellRef(cell_ref) =\u003e {\n                    assert_eq!(cell_ref.row, 2);\n                    assert_eq!(cell_ref.col, 2);\n                }\n                _ =\u003e panic!(\"Expected cell reference expression\"),\n            }\n        }\n        _ =\u003e panic!(\"Expected SetCell command\"),\n    }\n}\n\n#[test]\nfn test_parse_range() {\n    let result = parser::parse_command(\"A1=MIN(B2:C3)\");\n    assert!(result.is_ok());\n\n    let (_, command) = result.unwrap();\n    match command {\n        Command::SetCell { cell: _, expr } =\u003e match expr {\n            Expr::FunctionCall(Function::Min, boxed_arg) =\u003e match *boxed_arg {\n                Expr::Range(start, end) =\u003e {\n                    assert_eq!(start.col, 2);\n                    assert_eq!(start.row, 2);\n                    assert_eq!(end.col, 3);\n                    assert_eq!(end.row, 3);\n                }\n                _ =\u003e panic!(\"Expected range expression\"),\n            },\n            _ =\u003e panic!(\"Expected function call with range\"),\n        },\n        _ =\u003e panic!(\"Expected SetCell command\"),\n    }\n}\n\n#[test]\nfn test_parse_various_functions() {\n    // Test other function types\n    let functions = [\n        (\"MAX(A1:B2)\", Function::Max),\n        (\"AVG(A1:B2)\", Function::Avg),\n        (\"SUM(A1:B2)\", Function::Sum),\n        (\"STDEV(A1:B2)\", Function::Stdev),\n        (\"SLEEP(A1:B2)\", Function::Sleep),\n    ];\n\n    for (func_str, expected_func) in \u0026functions {\n        let cmd = format!(\"D4={}\", func_str);\n        let result = parser::parse_command(\u0026cmd);\n        assert!(result.is_ok());\n\n        let (_, command) = result.unwrap();\n        match command {\n            Command::SetCell { cell: _, expr } =\u003e match expr {\n                Expr::FunctionCall(func, _) =\u003e {\n                    assert!(matches!(func, f if f == *expected_func));\n                }\n                _ =\u003e panic!(\"Expected function call\"),\n            },\n            _ =\u003e panic!(\"Expected SetCell command\"),\n        }\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ajinkya486","lab4_2023cs10936","lab2_2023cs10936","tests","recalculation_test.rs"],"content":"use spreadsheet::command::{BinaryOp, CellRef, Command, Expr};\nuse spreadsheet::recalculation::{\n    RangeRef, RecalcManager, cell_to_string, extract_cell_refs, extract_range_refs, recalculate,\n    string_to_cell,\n};\nuse spreadsheet::sheet::{CellValue, Spreadsheet};\nuse std::collections::HashSet;\n\n#[test]\nfn test_cell_string_conversion() {\n    // Test converting CellRef to string\n    let cell = CellRef { row: 1, col: 1 };\n    assert_eq!(cell_to_string(\u0026cell), \"A1\");\n\n    let cell = CellRef { row: 10, col: 26 };\n    assert_eq!(cell_to_string(\u0026cell), \"Z10\");\n\n    let cell = CellRef { row: 5, col: 27 };\n    assert_eq!(cell_to_string(\u0026cell), \"AA5\");\n\n    // Test converting string to CellRef\n    let cell = string_to_cell(\"A1\").unwrap();\n    assert_eq!(cell.row, 1);\n    assert_eq!(cell.col, 1);\n\n    let cell = string_to_cell(\"Z10\").unwrap();\n    assert_eq!(cell.row, 10);\n    assert_eq!(cell.col, 26);\n\n    let cell = string_to_cell(\"AA5\").unwrap();\n    assert_eq!(cell.row, 5);\n    assert_eq!(cell.col, 27);\n\n    // Test edge cases\n    let cell = string_to_cell(\"AAA100\").unwrap();\n    assert_eq!(cell.row, 100);\n    assert_eq!(cell.col, 703);\n\n    // Test invalid cell string\n    assert!(string_to_cell(\"\").is_none());\n    assert!(string_to_cell(\"A\").is_none());\n    assert!(string_to_cell(\"1\").is_none());\n    assert!(string_to_cell(\"A-1\").is_none());\n    assert!(string_to_cell(\"1A\").is_none());\n}\n\n#[test]\nfn test_dependency_tracking() {\n    let mut manager = RecalcManager::new();\n\n    // Create a command where A1 depends on B1\n    let cmd = Command::SetCell {\n        cell: CellRef { row: 1, col: 1 },\n        expr: Expr::CellRef(CellRef { row: 1, col: 2 }),\n    };\n\n    let result = manager.update_for_command(\u0026cmd);\n    assert!(result.is_ok());\n\n    // Check that dependencies were recorded correctly\n    assert!(manager.parents.contains_key(\"A1\"));\n    let deps = manager.parents.get(\"A1\").unwrap();\n    assert!(deps.contains(\"B1\"));\n\n    assert!(manager.children.contains_key(\"B1\"));\n    let children = manager.children.get(\"B1\").unwrap();\n    assert!(children.contains(\"A1\"));\n\n    // Test updating an existing dependency\n    let cmd2 = Command::SetCell {\n        cell: CellRef { row: 1, col: 1 },\n        expr: Expr::CellRef(CellRef { row: 1, col: 3 }),\n    };\n\n    let result = manager.update_for_command(\u0026cmd2);\n    assert!(result.is_ok());\n\n    // B1 should no longer have A1 as a child\n    assert!(!manager.children.get(\"B1\").unwrap().contains(\"A1\"));\n\n    // C1 should now have A1 as a child\n    assert!(manager.children.get(\"C1\").unwrap().contains(\"A1\"));\n\n    // A1's parent should now be C1, not B1\n    assert!(!manager.parents.get(\"A1\").unwrap().contains(\"B1\"));\n    assert!(manager.parents.get(\"A1\").unwrap().contains(\"C1\"));\n}\n\n#[test]\nfn test_range_dependency() {\n    let mut manager = RecalcManager::new();\n\n    // A1 depends on range B1:C2\n    let cmd = Command::SetCell {\n        cell: CellRef { row: 1, col: 1 },\n        expr: Expr::Range(CellRef { row: 1, col: 2 }, CellRef { row: 2, col: 3 }),\n    };\n\n    let result = manager.update_for_command(\u0026cmd);\n    assert!(result.is_ok());\n\n    // Check that range dependencies were recorded correctly\n    assert!(manager.range_parents.contains_key(\"A1\"));\n    let range_deps = manager.range_parents.get(\"A1\").unwrap();\n    assert_eq!(range_deps.len(), 1);\n\n    let range_ref = range_deps.iter().next().unwrap();\n    assert_eq!(range_ref.start.col, 2);\n    assert_eq!(range_ref.start.row, 1);\n    assert_eq!(range_ref.end.col, 3);\n    assert_eq!(range_ref.end.row, 2);\n\n    // Check range_children\n    assert_eq!(manager.range_children.len(), 1);\n    let (range, child) = \u0026manager.range_children[0];\n    assert_eq!(child, \"A1\");\n    assert_eq!(range.start.col, 2);\n    assert_eq!(range.start.row, 1);\n    assert_eq!(range.end.col, 3);\n    assert_eq!(range.end.row, 2);\n\n    // Test modifying range dependency\n    let cmd2 = Command::SetCell {\n        cell: CellRef { row: 1, col: 1 },\n        expr: Expr::Range(CellRef { row: 3, col: 4 }, CellRef { row: 4, col: 5 }),\n    };\n\n    let result = manager.update_for_command(\u0026cmd2);\n    assert!(result.is_ok());\n\n    // Check that old range dependency is removed\n    let range_deps = manager.range_parents.get(\"A1\").unwrap();\n    assert_eq!(range_deps.len(), 1);\n    let range_ref = range_deps.iter().next().unwrap();\n    assert_eq!(range_ref.start.row, 3);\n    assert_eq!(range_ref.start.col, 4);\n\n    // Check range_children is updated\n    assert_eq!(manager.range_children.len(), 1);\n    let (range, child) = \u0026manager.range_children[0];\n    assert_eq!(child, \"A1\");\n    assert_eq!(range.start.row, 3);\n    assert_eq!(range.start.col, 4);\n}\n\n#[test]\nfn test_range_contains() {\n    // Normal range\n    let range = RangeRef {\n        start: CellRef { row: 1, col: 1 },\n        end: CellRef { row: 3, col: 3 },\n    };\n\n    // Test cells inside range\n    assert!(range.contains(\u0026CellRef { row: 1, col: 1 }));\n    assert!(range.contains(\u0026CellRef { row: 2, col: 2 }));\n    assert!(range.contains(\u0026CellRef { row: 3, col: 3 }));\n\n    // Test cells outside range\n    assert!(!range.contains(\u0026CellRef { row: 4, col: 4 }));\n    assert!(!range.contains(\u0026CellRef { row: 0, col: 0 }));\n\n    // Test inverted range (end before start)\n    let inverted_range = RangeRef {\n        start: CellRef { row: 3, col: 3 },\n        end: CellRef { row: 1, col: 1 },\n    };\n\n    // Should still contain the same cells\n    assert!(inverted_range.contains(\u0026CellRef { row: 1, col: 1 }));\n    assert!(inverted_range.contains(\u0026CellRef { row: 2, col: 2 }));\n    assert!(inverted_range.contains(\u0026CellRef { row: 3, col: 3 }));\n}\n\n#[test]\nfn test_cycle_detection() {\n    let mut manager = RecalcManager::new();\n\n    // Set up A1 = B1\n    let cmd1 = Command::SetCell {\n        cell: CellRef { row: 1, col: 1 },\n        expr: Expr::CellRef(CellRef { row: 1, col: 2 }),\n    };\n    let result = manager.update_for_command(\u0026cmd1);\n    assert!(result.is_ok());\n\n    // Set up B1 = C1\n    let cmd2 = Command::SetCell {\n        cell: CellRef { row: 1, col: 2 },\n        expr: Expr::CellRef(CellRef { row: 1, col: 3 }),\n    };\n    let result = manager.update_for_command(\u0026cmd2);\n    assert!(result.is_ok());\n\n    // Try to set up C1 = A1, which would create a cycle\n    let cmd3 = Command::SetCell {\n        cell: CellRef { row: 1, col: 3 },\n        expr: Expr::CellRef(CellRef { row: 1, col: 1 }),\n    };\n    let result = manager.update_for_command(\u0026cmd3);\n    assert!(result.is_err());\n\n    // Make sure the cycle error contains the appropriate cell\n    let err = result.unwrap_err();\n    assert!(err.contains(\"Cycle detected\"));\n\n    // Test cycle through range dependencies\n    let mut manager = RecalcManager::new();\n\n    // A1 = B1\n    manager\n        .update_for_command(\u0026Command::SetCell {\n            cell: CellRef { row: 1, col: 1 },\n            expr: Expr::CellRef(CellRef { row: 1, col: 2 }),\n        })\n        .unwrap();\n\n    // B1 = range(C1:D1)\n    manager\n        .update_for_command(\u0026Command::SetCell {\n            cell: CellRef { row: 1, col: 2 },\n            expr: Expr::Range(CellRef { row: 1, col: 3 }, CellRef { row: 1, col: 4 }),\n        })\n        .unwrap();\n\n    // Try C1 = A1 which would create a cycle through range\n    let result = manager.update_for_command(\u0026Command::SetCell {\n        cell: CellRef { row: 1, col: 3 },\n        expr: Expr::CellRef(CellRef { row: 1, col: 1 }),\n    });\n\n    assert!(result.is_err());\n    assert!(result.unwrap_err().contains(\"Cycle detected\"));\n}\n\n#[test]\nfn test_topological_sort() {\n    let mut manager = RecalcManager::new();\n\n    // Set up A1 = B1 + C1\n    let cmd1 = Command::SetCell {\n        cell: CellRef { row: 1, col: 1 },\n        expr: Expr::BinaryOp(\n            Box::new(Expr::CellRef(CellRef { row: 1, col: 2 })),\n            BinaryOp::Add,\n            Box::new(Expr::CellRef(CellRef { row: 1, col: 3 })),\n        ),\n    };\n    let result = manager.update_for_command(\u0026cmd1);\n    assert!(result.is_ok());\n\n    // Set up D1 = A1\n    let cmd2 = Command::SetCell {\n        cell: CellRef { row: 1, col: 4 },\n        expr: Expr::CellRef(CellRef { row: 1, col: 1 }),\n    };\n    let result = manager.update_for_command(\u0026cmd2);\n    assert!(result.is_ok());\n\n    // Check that updating B1 correctly identifies cells to recalculate\n    let exclude = \"B1\".to_string();\n    let result = manager.topological_sort_excluding(\u0026exclude);\n    assert!(result.is_ok());\n\n    let order = result.unwrap();\n    // A1 depends on B1, and D1 depends on A1, so both should be recalculated\n    assert!(order.contains(\u0026\"A1\".to_string()));\n    assert!(order.contains(\u0026\"D1\".to_string()));\n    // And A1 must come before D1\n    let pos_a1 = order.iter().position(|s| s == \"A1\").unwrap();\n    let pos_d1 = order.iter().position(|s| s == \"D1\").unwrap();\n    assert!(pos_a1 \u003c pos_d1);\n\n    // Test with range dependency\n    let mut manager = RecalcManager::new();\n\n    // E1 = SUM(A1:B1)\n    let cmd = Command::SetCell {\n        cell: CellRef { row: 1, col: 5 },\n        expr: Expr::Range(CellRef { row: 1, col: 1 }, CellRef { row: 1, col: 2 }),\n    };\n    manager.update_for_command(\u0026cmd).unwrap();\n\n    // F1 = E1\n    let cmd2 = Command::SetCell {\n        cell: CellRef { row: 1, col: 6 },\n        expr: Expr::CellRef(CellRef { row: 1, col: 5 }),\n    };\n    manager.update_for_command(\u0026cmd2).unwrap();\n\n    // Updating A1 should cause E1 and F1 to be recalculated\n    let order = manager\n        .topological_sort_excluding(\u0026\"A1\".to_string())\n        .unwrap();\n    assert!(order.contains(\u0026\"E1\".to_string()));\n    assert!(order.contains(\u0026\"F1\".to_string()));\n    let pos_e1 = order.iter().position(|s| s == \"E1\").unwrap();\n    let pos_f1 = order.iter().position(|s| s == \"F1\").unwrap();\n    assert!(pos_e1 \u003c pos_f1);\n}\n\n#[test]\nfn test_extract_cell_refs() {\n    let mut refs = HashSet::new();\n\n    // Test simple cell ref\n    let expr = Expr::CellRef(CellRef { row: 1, col: 1 });\n    extract_cell_refs(\u0026expr, \u0026mut refs);\n    assert!(refs.contains(\"A1\"));\n\n    // Test binary op with multiple refs\n    refs.clear();\n    let expr = Expr::BinaryOp(\n        Box::new(Expr::CellRef(CellRef { row: 1, col: 1 })),\n        BinaryOp::Add,\n        Box::new(Expr::CellRef(CellRef { row: 2, col: 2 })),\n    );\n    extract_cell_refs(\u0026expr, \u0026mut refs);\n    assert!(refs.contains(\"A1\"));\n    assert!(refs.contains(\"B2\"));\n\n    // Test function call\n    refs.clear();\n    let expr = Expr::FunctionCall(\n        spreadsheet::command::Function::Sum,\n        Box::new(Expr::CellRef(CellRef { row: 3, col: 3 })),\n    );\n    extract_cell_refs(\u0026expr, \u0026mut refs);\n    assert!(refs.contains(\"C3\"));\n\n    // Test range\n    refs.clear();\n    let expr = Expr::Range(CellRef { row: 1, col: 1 }, CellRef { row: 3, col: 3 });\n    extract_cell_refs(\u0026expr, \u0026mut refs);\n    assert!(refs.contains(\"A1\"));\n    assert!(refs.contains(\"C3\"));\n\n    // Test constant - should not add any refs\n    refs.clear();\n    let expr = Expr::Constant(42);\n    extract_cell_refs(\u0026expr, \u0026mut refs);\n    assert!(refs.is_empty());\n}\n\n#[test]\nfn test_extract_range_refs() {\n    let mut range_refs = HashSet::new();\n\n    // Test simple range\n    let expr = Expr::Range(CellRef { row: 1, col: 1 }, CellRef { row: 3, col: 3 });\n    extract_range_refs(\u0026expr, \u0026mut range_refs);\n    assert_eq!(range_refs.len(), 1);\n    let range = range_refs.iter().next().unwrap();\n    assert_eq!(range.start.row, 1);\n    assert_eq!(range.start.col, 1);\n    assert_eq!(range.end.row, 3);\n    assert_eq!(range.end.col, 3);\n\n    // Test binary op with range\n    range_refs.clear();\n    let expr = Expr::BinaryOp(\n        Box::new(Expr::Range(\n            CellRef { row: 1, col: 1 },\n            CellRef { row: 2, col: 2 },\n        )),\n        BinaryOp::Add,\n        Box::new(Expr::Range(\n            CellRef { row: 3, col: 3 },\n            CellRef { row: 4, col: 4 },\n        )),\n    );\n    extract_range_refs(\u0026expr, \u0026mut range_refs);\n    assert_eq!(range_refs.len(), 2);\n\n    // Test function call with range\n    range_refs.clear();\n    let expr = Expr::FunctionCall(\n        spreadsheet::command::Function::Sum,\n        Box::new(Expr::Range(\n            CellRef { row: 1, col: 1 },\n            CellRef { row: 5, col: 5 },\n        )),\n    );\n    extract_range_refs(\u0026expr, \u0026mut range_refs);\n    assert_eq!(range_refs.len(), 1);\n\n    // Test with cell ref - should not add any range\n    range_refs.clear();\n    let expr = Expr::CellRef(CellRef { row: 1, col: 1 });\n    extract_range_refs(\u0026expr, \u0026mut range_refs);\n    assert!(range_refs.is_empty());\n\n    // Test with constant - should not add any range\n    range_refs.clear();\n    let expr = Expr::Constant(42);\n    extract_range_refs(\u0026expr, \u0026mut range_refs);\n    assert!(range_refs.is_empty());\n}\n\n#[test]\nfn test_recalculate() {\n    let mut sheet = Spreadsheet::new(10, 10); // Create a 10x10 spreadsheet\n\n    // Set up B1 = 10, C1 = 5\n    sheet.set_by_key(\"B1\", CellValue::Value(10)).unwrap();\n    sheet.set_by_key(\"C1\", CellValue::Value(5)).unwrap();\n\n    // Set A1 = B1 + C1 (formula)\n    let a1_cell_str = cell_to_string(\u0026CellRef { row: 1, col: 1 });\n    sheet.set_formula(\n        \u0026a1_cell_str,\n        Expr::BinaryOp(\n            Box::new(Expr::CellRef(CellRef { row: 1, col: 2 })),\n            BinaryOp::Add,\n            Box::new(Expr::CellRef(CellRef { row: 1, col: 3 })),\n        ),\n    );\n\n    // Set D1 = A1 * 2 (formula)\n    let d1_cell_str = cell_to_string(\u0026CellRef { row: 1, col: 4 });\n    sheet.set_formula(\n        \u0026d1_cell_str,\n        Expr::BinaryOp(\n            Box::new(Expr::CellRef(CellRef { row: 1, col: 1 })),\n            BinaryOp::Multiply,\n            Box::new(Expr::Constant(2)),\n        ),\n    );\n\n    // Recalculate in topological order\n    recalculate(\u0026mut sheet, vec![\"A1\".to_string(), \"D1\".to_string()]);\n\n    // Check results\n    if let CellValue::Value(val) = sheet.get(0, 0).unwrap() {\n        assert_eq!(*val, 15); // B1 + C1 = 10 + 5 = 15\n    } else {\n        panic!(\"A1 should be a Value\");\n    }\n\n    if let CellValue::Value(val) = sheet.get(0, 3).unwrap() {\n        assert_eq!(*val, 30); // A1 * 2 = 15 * 2 = 30\n    } else {\n        panic!(\"D1 should be a Value\");\n    }\n\n    // Test error handling in recalculate\n    // Make A1 refer to a non-existent cell (outside the 10x10 grid we created)\n    sheet.set_formula(\u0026a1_cell_str, Expr::CellRef(CellRef { row: 20, col: 20 }));\n\n    recalculate(\u0026mut sheet, vec![\"A1\".to_string(), \"D1\".to_string()]);\n\n    // A1 should now be an error\n    if let CellValue::Error(_) = sheet.get(0, 0).unwrap() {\n        // Test passed\n    } else {\n        panic!(\"A1 should be an Error\");\n    }\n\n    // And D1 should also propagate the error\n    if let CellValue::Error(_) = sheet.get(0, 3).unwrap() {\n        // Test passed\n    } else {\n        panic!(\"D1 should be an Error\");\n    }\n}\n","traces":[],"covered":0,"coverable":0},{"path":["/","home","ajinkya486","lab4_2023cs10936","lab2_2023cs10936","tests","sheet_test.rs"],"content":"use spreadsheet::sheet::{CellValue, Spreadsheet};\n\n#[test]\nfn test_display_spreadsheet() {\n    let mut sheet = Spreadsheet::new(20, 20);\n\n    // Set some values to be displayed\n    sheet.set(0, 0, CellValue::Value(100)).unwrap();\n    sheet.set(1, 1, CellValue::Value(200)).unwrap();\n    sheet.set(2, 2, CellValue::Error(())).unwrap();\n\n    // This test doesn't check the output, but makes sure the method doesn't panic\n    sheet.display_spreadsheet(0, 0);\n    sheet.display_spreadsheet(5, 5);\n}\n\n#[test]\nfn test_scroll_edge_cases() {\n    let mut sheet = Spreadsheet::new(5, 5);\n\n    // Test scrolling up when already at top\n    assert!(sheet.scroll_spreadsheet('w').is_ok());\n    assert_eq!(sheet.scroll_row, 0);\n\n    // Test scrolling left when already at leftmost\n    assert!(sheet.scroll_spreadsheet('a').is_ok());\n    assert_eq!(sheet.scroll_col, 0);\n\n    // Test scrolling down beyond the max\n    for _ in 0..10 {\n        sheet.scroll_spreadsheet('s').unwrap();\n    }\n    assert_eq!(sheet.scroll_row, 0); // 5 rows - 10 display rows = 0, min is 0\n\n    // Test scrolling right beyond the max\n    for _ in 0..10 {\n        sheet.scroll_spreadsheet('d').unwrap();\n    }\n    assert_eq!(sheet.scroll_col, 0); // 5 cols - 10 display cols = 0, min is 0\n}\n\n#[test]\nfn test_scroll_to_edge_cases() {\n    let mut sheet = Spreadsheet::new(100, 100);\n\n    // Scroll to a valid cell\n    assert!(sheet.scroll_to(\"C5\").is_ok());\n    assert_eq!(sheet.scroll_row, 4);\n    assert_eq!(sheet.scroll_col, 2);\n\n    // Test empty cell reference\n    assert!(sheet.scroll_to(\"\").is_err());\n\n    // Test cell reference starting with a number\n    assert!(sheet.scroll_to(\"1A\").is_err());\n\n    // Test out of bounds cell reference\n    assert!(sheet.scroll_to(\"Z200\").is_err());\n}\n\n#[test]\nfn test_cell_string_to_indices_edge_cases() {\n    // Test empty string\n    assert_eq!(Spreadsheet::cell_string_to_indices(\"\"), None);\n\n    // Test string without letter\n    assert_eq!(Spreadsheet::cell_string_to_indices(\"123\"), None);\n\n    // Test string without number\n    assert_eq!(Spreadsheet::cell_string_to_indices(\"ABC\"), None);\n\n    // Test string with invalid format (number first)\n    assert_eq!(Spreadsheet::cell_string_to_indices(\"1A\"), None);\n\n    // Test string with extra characters\n    assert_eq!(Spreadsheet::cell_string_to_indices(\"A1X\"), None);\n\n    // Test complex but valid cell reference\n    assert_eq!(\n        Spreadsheet::cell_string_to_indices(\"ABC123\"),\n        Some((122, 730))\n    );\n}\n\n#[test]\nfn test_cell_key_to_index_invalid_characters() {\n    // Test with invalid characters\n    let result = Spreadsheet::cell_key_to_index(\"A$1\");\n    assert!(result.is_err());\n    assert_eq!(result.unwrap_err().contains(\"Invalid character\"), true);\n\n    // Test with spaces\n    let result = Spreadsheet::cell_key_to_index(\"A 1\");\n    assert!(result.is_err());\n\n    // Test with special characters\n    let result = Spreadsheet::cell_key_to_index(\"A@1\");\n    assert!(result.is_err());\n}\n\n#[test]\nfn test_cell_key_to_index_empty_parts() {\n    // Test with empty row part\n    let result = Spreadsheet::cell_key_to_index(\"A\");\n    assert!(result.is_err());\n    assert_eq!(\n        result.unwrap_err().contains(\"Invalid cell key format\"),\n        true\n    );\n\n    // Test with empty column part\n}\n\n#[test]\nfn test_cell_key_to_index() {\n    // Test simple cell reference\n    let result = Spreadsheet::cell_key_to_index(\"A1\");\n    assert!(result.is_ok());\n    let (row, col) = result.unwrap();\n    assert_eq!(row, 0);\n    assert_eq!(col, 0);\n\n    // Test multi-letter column\n    let result = Spreadsheet::cell_key_to_index(\"AA10\");\n    assert!(result.is_ok());\n    let (row, col) = result.unwrap();\n    assert_eq!(row, 9);\n    assert_eq!(col, 26);\n\n    // Test invalid cell reference\n    let result = Spreadsheet::cell_key_to_index(\"A\");\n    assert!(result.is_err());\n}\n\n#[test]\nfn test_set_by_key() {\n    let mut sheet = Spreadsheet::new(10, 10);\n\n    // Test setting by key\n    let result = sheet.set_by_key(\"B3\", CellValue::Value(123));\n    assert!(result.is_ok());\n\n    // Test getting the value back\n    if let Some(CellValue::Value(val)) = sheet.get(2, 1) {\n        assert_eq!(*val, 123);\n    } else {\n        panic!(\"Expected to retrieve a value of 123\");\n    }\n\n    // Test invalid key\n    let result = sheet.set_by_key(\"Z99\", CellValue::Value(456));\n    assert!(result.is_err());\n}\n\n#[test]\nfn test_multiple_set_by_key() {\n    let mut sheet = Spreadsheet::new(20, 20);\n\n    // Set values at multiple positions\n    assert!(sheet.set_by_key(\"A1\", CellValue::Value(1)).is_ok());\n    assert!(sheet.set_by_key(\"B2\", CellValue::Value(2)).is_ok());\n    assert!(sheet.set_by_key(\"C3\", CellValue::Value(3)).is_ok());\n    assert!(sheet.set_by_key(\"D4\", CellValue::Value(4)).is_ok());\n    assert!(sheet.set_by_key(\"E5\", CellValue::Value(5)).is_ok());\n\n    // Verify all values\n    assert_eq!(*sheet.get(0, 0).unwrap(), CellValue::Value(1));\n    assert_eq!(*sheet.get(1, 1).unwrap(), CellValue::Value(2));\n    assert_eq!(*sheet.get(2, 2).unwrap(), CellValue::Value(3));\n    assert_eq!(*sheet.get(3, 3).unwrap(), CellValue::Value(4));\n    assert_eq!(*sheet.get(4, 4).unwrap(), CellValue::Value(5));\n}\n\n#[test]\nfn test_formula_storage() {\n    use spreadsheet::command::Expr;\n\n    let mut sheet = Spreadsheet::new(5, 5);\n    let expr = Expr::Constant(42);\n\n    // Set a formula\n    sheet.set_formula(\"A1\", expr.clone());\n\n    // Get it back\n    let retrieved = sheet.get_formula(\"A1\");\n    assert!(retrieved.is_some());\n\n    // Check a nonexistent formula\n    let not_there = sheet.get_formula(\"B2\");\n    assert!(not_there.is_none());\n}\n\n#[test]\nfn test_multiple_formulas() {\n    use spreadsheet::command::Expr;\n\n    let mut sheet = Spreadsheet::new(10, 10);\n\n    // Add multiple formulas\n    sheet.set_formula(\"A1\", Expr::Constant(10));\n    sheet.set_formula(\"B2\", Expr::Constant(20));\n    sheet.set_formula(\"C3\", Expr::Constant(30));\n\n    // Check all formulas exist\n    assert!(sheet.get_formula(\"A1\").is_some());\n    assert!(sheet.get_formula(\"B2\").is_some());\n    assert!(sheet.get_formula(\"C3\").is_some());\n\n    // Test overwriting a formula\n    sheet.set_formula(\"A1\", Expr::Constant(100));\n    match sheet.get_formula(\"A1\") {\n        Some(Expr::Constant(val)) =\u003e assert_eq!(*val, 100),\n        _ =\u003e panic!(\"Expected to get Expr::Constant(100)\"),\n    }\n}\n\n#[test]\nfn test_convert_to_column_name() {\n    // Test the column name conversion\n    let name = Spreadsheet::convert_to_column_name(0);\n    assert_eq!(name, \"A\");\n\n    let name = Spreadsheet::conv (\"AA10\"), Some((9, 26)));\n\n    // Invalid cell references\n    assert_eq!(Spreadsheet::cell_string_to_indices(\"\"), None);\n    assert_eq!(Spreadsheet::cell_string_to_indices(\"A\"), None);\n    assert_eq!(Spreadsheet::cell_string_to_indices(\"123\"), None);\n    assert_eq!(Spreadsheet::cell_string_to_indices(\"1A\"), None);\n    assert_eq!(Spreadsheet::cell_string_to_indices(\"A1B\"), None);\n}\n\n// #[test]\n// fn test_display_spreadsheet() {\n//     let mut sheet = Spreadsheet::new(20, 20);\n\n//     // Set some values to be displayed\n//     sheet.set(0, 0, CellValue::Value(100)).unwrap();\n//     sheet.set(1, 1, CellValue::Value(200)).unwrap();\n//     sheet.set(2, 2, CellValue::Error(())).unwrap();\n\n//     // This test doesn't check the output, but makes sure the method doesn't panic\n//     sheet.display_spreadsheet(0, 0);\n//     sheet.display_spreadsheet(5, 5);\n// }\n\n// #[test]\n// fn test_scroll_edge_cases() {\n//     let mut sheet = Spreadsheet::new(5, 5);\n\n//     // Test scrolling up when already at top\n//     assert!(sheet.scroll_spreadsheet('w').is_ok());\n//     assert_eq!(sheet.scroll_row, 0);\n\n//     // Test scrolling left when already at leftmost\n//     assert!(sheet.scroll_spreadsheet('a').is_ok());\n//     assert_eq!(sheet.scroll_col, 0);\n\n//     // Test scrolling down beyond the max\n//     for _ in 0..10 {\n//         sheet.scroll_spreadsheet('s').unwrap();\n//     }\n//     assert_eq!(sheet.scroll_row, 0); // 5 rows - 10 display rows = 0, min is 0\n\n//     // Test scrolling right beyond the max\n//     for _ in 0..10 {\n//         sheet.scroll_spreadsheet('d').unwrap();\n//     }\n//     assert_eq!(sheet.scroll_col, 0); // 5 cols - 10 display cols = 0, min is 0\n// }\n\n// #[test]\n// fn test_scroll_to_edge_cases() {\n//     let mut sheet = Spreadsheet::new(100, 100);\n\n//     // Scroll to a valid cell\n//     assert!(sheet.scroll_to(\"C5\").is_ok());\n//     assert_eq!(sheet.scroll_row, 4);\n//     assert_eq!(sheet.scroll_
