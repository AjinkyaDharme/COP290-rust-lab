}\n    }\n}\n\npub fn eval_expr(expr: \u0026Expr, sheet: \u0026Spreadsheet) -\u003e Result\u003ci32, EvalError\u003e {\n    match expr {\n        Expr::Constant(v) =\u003e Ok(*v),\n        Expr::CellRef(CellRef { row, col }) =\u003e {\n            let r = (*row as usize).saturating_sub(1);\n            let c = (*col as usize).saturating_sub(1);\n            match sheet.get(r, c) {\n                Some(CellValue::Value(v)) =\u003e Ok(*v),\n                Some(CellValue::Error(_)) =\u003e Err(EvalError::CellError),\n                None =\u003e Err(EvalError::OutOfBounds),\n            }\n        }\n        Expr::BinaryOp(lhs, op, rhs) =\u003e {\n            let l = eval_expr(lhs, sheet)?;\n            let r = eval_expr(rhs, sheet)?;\n            match op {\n                BinaryOp::Add =\u003e Ok(l + r),\n                BinaryOp::Subtract =\u003e Ok(l - r),\n                BinaryOp::Multiply =\u003e Ok(l * r),\n                BinaryOp::Divide =\u003e {\n                    if r == 0 {\n                        Err(EvalError::DivByZero)\n                    } else {\n                        Ok(l / r)\n                    }\n                }\n            }\n        }\n        Expr::FunctionCall(func, arg) =\u003e {\n            match func {\n                Function::Sleep =\u003e {\n                    let v = eval_expr(arg, sheet)?;\n                    sleep(Duration::from_secs(v as u64));\n                    Ok(v)\n                }\n\n                Function::Sum | Function::Min | Function::Max | Function::Avg | Function::Stdev =\u003e {\n                    match \u0026**arg {\n                        Expr::Range(start, end) =\u003e {\n                            if start.row \u003e end.row || start.col \u003e end.col {\n                                return Err(EvalError::Other(\"Invalid range\".into()));\n                            }\n\n                            let start_row = (start.row - 1) as usize;\n                            let end_row = (end.row - 1) as usize;\n                            let start_col = (start.col - 1) as usize;\n                            let end_col = (end.col - 1) as usize;\n                            let mut values = Vec::new();\n                            for r in start_row..=end_row {\n                                for c in start_col..=end_col {\n                                    match sheet.get(r, c) {\n                                        Some(CellValue::Value(v)) =\u003e values.push(*v),\n                                        Some(CellValue::Error(_)) =\u003e {\n                                            return Err(EvalError::CellError);\n                                        }\n                                        None =\u003e return Err(EvalError::OutOfBounds),\n                                    }\n                                }\n                            }\n                            if values.is_empty() {\n                                return Err(EvalError::Other(\"Empty range\".into()));\n                            }\n                            match func {\n                                Function::Sum =\u003e Ok(values.iter().sum()),\n                                Function::Min =\u003e values\n                                    .into_iter()\n                                    .min()\n                                    .ok_or_else(|| EvalError::Other(\"Empty range\".into())),\n                                Function::Max =\u003e values\n                                    .into_iter()\n                                    .max()\n                                    .ok_or_else(|| EvalError::Other(\"Empty range\".into())),\n                                Function::Avg =\u003e {\n                                    let sum: i32 = values.iter().sum();\n                                    Ok(sum / (values.len() as i32))\n                                }\n                                Function::Stdev =\u003e {\n                                    let n = values.len();\n                                    if n \u003c= 1 {\n                                        return Ok(0); // Avoid division by zero\n                                    }\n\n                                    let sum: i64 = values.iter().map(|\u0026v| v as i64).sum();\n                                    let sum_of_squares: i64 =\n                                        values.iter().map(|\u0026v| (v as i64) * (v as i64)).sum();\n\n                                    // Using the formula: sqrt((n * sum_of_squares - sum * sum) / n²)\n                                    let n_f64 = n as f64;\n                                    let variance = ((n_f64 * sum_of_squares as f64)\n                                        - (sum as f64 * sum as f64))\n                                        / (n_f64 * n_f64);\n                                    let std_dev = variance.sqrt();\n\n                                    // Round to nearest integer\n                                    Ok(std_dev.round() as i32)\n                                }\n                                _ =\u003e Err(EvalError::Other(format!(\n                                    \"Function {:?} not implemented for range\",\n                                    func\n                                ))),\n                            }\n                        }\n                        _ =\u003e Err(EvalError::Other(format!(\n                            \"Function {:?} requires a range argument\",\n                            func\n                        ))),\n                    }\n                }\n            }\n        }\n        Expr::Range(_, _) =\u003e Err(EvalError::Other(\"Cannot evaluate a range by itself\".into())),\n    }\n}\n\npub fn evaluate_command(\n    cmd: Command,\n    sheet: \u0026mut Spreadsheet,\n    output_enabled: \u0026mut bool,\n) -\u003e Result\u003c(), EvalError\u003e {\n    match cmd {\n        Command::SetCell { cell, expr } =\u003e {\n eadsheet('s').map_err(EvalError::Other)?;\n        }\n        Command::ScrollLeft =\u003e {\n            sheet.scroll_spreadsheet('a').map_err(EvalError::Other)?;\n        }\n        Command::ScrollRight =\u003e {\n            sheet.scroll_spreadsheet('d').map_err(EvalError::Other)?;\n        }\n        Command::ScrollTo(cell) =\u003e {\n            let cell_str = format!(\"{}{}\", convert_col_to_name(cell.col), cell.row);\n            sheet.scroll_to(\u0026cell_str).map_err(EvalError::Other)?;\n        }\n        Command::DisableOutput =\u003e {\n            *output_enabled = false;\n        }\n        Command::EnableOutput =\u003e {\n            *output_enabled = true;\n        }\n        Command::Quit =\u003e {\n            // handled in main loop.\n        }\n    }\n    Ok(())\n}\n\n/// Helper: convert a 1-based column index to its column name (e.g., 1 -\u003e A, 27 -\u003e AA).\npub fn convert_col_to_name(mut col: u16) -\u003e String {\n    let mut name = String::new();\n    while col \u003e 0 {\n        let rem = ((col - 1) % 26) as u8;\n        name.insert(0, (b'A' + rem) as char);\n        col = (col - 1) / 26;\n    }\n    name\n}\n","traces":[{"line":17,"address":[286304],"length":1,"stats":{"Line":1}},{"line":18,"address":[684448],"length":1,"stats":{"Line":1}},{"line":19,"address":[684508],"length":1,"stats":{"Line":1}},{"line":20,"address":[286440],"length":1,"stats":{"Line":1}},{"line":21,"address":[286484],"length":1,"stats":{"Line":1}},{"line":22,"address":[286535],"length":1,"stats":{"Line":1}},{"line":27,"address":[628956,623664,628988],"length":1,"stats":{"Line":4}},{"line":28,"address":[220599],"length":1,"stats":{"Line":4}},{"line":29,"address":[598580],"length":1,"stats":{"Line":2}},{"line":30,"address":[684955],"length":1,"stats":{"Line":3}},{"line":31,"address":[286877,286927],"length":1,"stats":{"Line":6}},{"line":32,"address":[286935,286985],"length":1,"stats":{"Line":6}},{"line":33,"address":[576753,577239],"length":1,"stats":{"Line":6}},{" 936","src","recalculation.rs"],"content":"use crate::command::{CellRef, Command, Expr};\nuse crate::evaluator::eval_expr;\nuse crate::sheet::{CellValue, Spreadsheet};\nuse std::collections::{HashMap, HashSet};\n\n/// New type to represent a range dependency.\n#[derive(Debug, Clone, PartialEq, Eq, Hash)]\npub struct RangeRef {\n    pub start: CellRef,\n    pub end: CellRef,\n}\n\nimpl RangeRef {\n    pub fn contains(\u0026self, cell: \u0026CellRef) -\u003e bool {\n        let (s_col, s_row) = (self.start.col, self.start.row);\n        let (e_col, e_row) = (self.end.col, self.end.row);\n        let (min_col, max_col) = (s_col.min(e_col), s_col.max(e_col));\n        let (min_row, max_row) = (s_row.min(e_row), s_row.max(e_row));\n        (cell.col \u003e= min_col \u0026\u0026 cell.col \u003c= max_col) \u0026\u0026 (cell.row \u003e= min_row \u0026\u0026 cell.row \u003c= max_row)\n    }\n}\n\npub fn string_to_cell(s: \u0026str) -\u003e Option\u003cCellRef\u003e {\n    let (col_letters, row_digits) = s.split_at(s.find(|c: char| c.is_ascii_digit())?);\n    if col_letters.is_empty() || row_digits.is_empty() {\n        return None;\n    }\n    let mut col = 0;\n    for c in col_letters.chars() {\n        if !c.is_ascii_alphabetic() {\n            return None;\n        }\n        col = col * 26 + ((c.to_ascii_uppercase() as u8) - b'A' + 1) as u16;\n    }\n    let row = row_digits.parse::\u003cu16\u003e().ok()?;\n    Some(CellRef { col, row })\n}\n\npub type DependencyGraph = HashMap\u003cString, HashSet\u003cString\u003e\u003e;\n\n#[derive(Debug, Clone)]\npub struct RecalcManager {\n    pub children: DependencyGraph,\n    pub parents: DependencyGraph,\n    pub range_parents: HashMap\u003cString, HashSet\u003cRangeRef\u003e\u003e,\n    pub range_children: Vec\u003c(RangeRef, String)\u003e,\n}\nimpl Default for RecalcManager {\n    fn default() -\u003e Self {\n        Self::new()\n    }\n}\nimpl RecalcManager {\n    pub fn new() -\u003e Self {\n        Self {\n            children: HashMap::new(),\n            parents: HashMap::new(),\n            range_parents: HashMap::new(),\n            range_children: Vec::new(),\n        }\n    }\n\n    pub fn update_for_command(\u0026mut self, cmd: \u0026Command) -\u003e Result\u003cVec\u003cString\u003e, String\u003e {\n        if let Command::SetCell { cell, expr } = cmd {\n            let cell_key = cell_to_string(cell);\n\n            // Extract single cell dependencies.\n            let mut new_refs = HashSet::new();\n            extract_cell_refs(expr, \u0026mut new_refs);\n\n            // Extract range dependencies.\n            let mut new_range_refs: HashSet\u003cRangeRef\u003e = HashSet::new();\n            extract_range_refs(expr, \u0026mut new_range_refs);\n\n            // Get current dependencies for this cell.\n            let old_refs = self.parents.get(\u0026cell_key).cloned().unwrap_or_default();\n            let old_range_refs = self\n                .range_parents\n                .get(\u0026cell_key)\n                .cloned()\n                .unwrap_or_default();\n\n            // Determine differences.\n            let removed = old_refs\n                .difference(\u0026new_refs)\n                .cloned()\n                .collect::\u003cHashSet\u003c_\u003e\u003e();\n            let added = new_refs\n                .difference(\u0026old_refs)\n                .cloned()\n                .collect::\u003cHashSet\u003c_\u003e\u003e();\n\n            let removed_range = old_range_refs\n                .difference(\u0026new_range_refs)\n                .cloned()\n                .collect::\u003cHashSet\u003c_\u003e\u003e();\n            let added_range = new_range_refs\n                .difference(\u0026old_range_refs)\n                .cloned()\n                .collect::\u003cHashSet\u003c_\u003e\u003e();\n\n            // Update parent's entry with new single cell dependencies.\n            self.parents.insert(cell_key.clone(), new_refs.clone());\n            // Update range_parents entry.\n            self.range_parents\n                .insert(cell_key.clone(), new_range_refs.clone());\n\n            // For removed single cell dependencies, remove cell_key from their children.\n            for dep in \u0026removed {\n                if let Some(child_set) = self.children.get_mut(dep) {\n                    child_set.remove(\u0026cell_key);\n                }\n            }\n            // For newly added single cell dependencies, add cell_key to their children.\n            for dep in \u0026added {\n                self.children\n                    .entry(dep.clone())\n                    .or_default()\n                    .insert(cell_key.clone());\n            }\n            // For removed range dependencies, remove from range_children.\n            self.range_children\n                .retain(|(range, child)| !(child == \u0026cell_key \u0026\u0026 removed_range.contains(range)));\n            // For newly added range dependencies, add to range_children.\n            for range in \u0026added_range {\n                self.range_children.push((range.clone(), cell_key.clone()));\n            }\n\n            // Attempt to compute the topological order (using both children and range_children) for affected cells.\n            match self.topological_sort_excluding(\u0026cell_key) {\n                Ok(order) =\u003e return Ok(order),\n                Err(e) =\u003e {\n                    // Roll back updates.\n                    self.parents.insert(cell_key.clone(), old_refs.clone());\n                    self.range_parents\n                        .insert(cell_key.clone(), old_range_refs.clone());\n                    for dep in \u0026added {\n                        if let Some(child_set) = self.children.get_mut(dep) {\n                            child_set.remove(\u0026cell_key);\n                        }\n                    }\n                    for dep in \u0026removed {\n                        self.children\n                            .entry(dep.clone())\n                            .or_default()\n                            .insert(cell_key.clone());\n                    }\n                    // Roll back range dependencies.\n                    self.range_children.retain(|(range, child)| {\n                        !(child == \u0026cell_key \u0026\u0026 added_range.contains(range))\n                    });\n                    // Re-add removed ranges.\n                    for range in \u0026removed_range {\n                        self.range_children.push((range.clone(), cell_key.clone()));\n                    }\n                    return Err(e);\n                }\n            }\n        }\n        Ok(Vec::new())\n    }\n\n    pub fn topological_sort_excluding(\u0026self, exclude: \u0026String) -\u003e Result\u003cVec\u003cString\u003e, String\u003e {\n        let mut fully_visited: HashSet\u003cString\u003e = HashSet::new();\n        let mut in_current_path: HashSet\u003cString\u003e = HashSet::new();\n        let mut result: Vec\u003cString\u003e = Vec::new();\n        let mut dfs_stack: Vec\u003c(String, bool)\u003e = Vec::new();\n\n        // Helper to push all dependents (both direct and via range) for a given cell key.\n        let push_dependents = |cell_key: \u0026String,\n                               stack: \u0026mut Vec\u003c(String, bool)\u003e,\n                               fully_visited: \u0026HashSet\u003cString\u003e| {\n            // Direct children.\n            if let Some(children) = self.children.get(cell_key) {\n                for child in children {\n                    if !fully_visited.contains(child) {\n                        stack.push((child.clone(), false));\n                    }\n                }\n            }\n            // Range dependencies: if cell_key can be parsed to a CellRef, then search range_children.\n            if let Some(cell_ref) = string_to_cell(cell_key) {\n                for (range, dependent) in \u0026self.range_children {\n                    // Use dependent only if not already visited.\n                    if range.contains(\u0026cell_ref) \u0026\u0026 !fully_visited.contains(dependent) {\n                        stack.push((dependent.clone(), false));\n                    }\n                }\n            }\n        };\n\n        // Start from all direct children (and those from range deps) of the updated cell.\n        push_dependents(exclude, \u0026mut dfs_stack, \u0026fully_visited);\n\n        while let Some((current, expanded)) = dfs_stack.pop() {\n            if expanded {\n                in_current_path.remove(\u0026current);\n                if !result.contains(\u0026current) {\n                    result.push(current.clone());\n                }\n                fully_visited.insert(current);\n            } else {\n                if in_current_path.contains(\u0026current) {\n                    return Err(format!(\"Cycle detected at {}\", current));\n                }\n                in_current_path.insert(current.clone());\n                dfs_stack.push((current.clone(), true));\n                push_dependents(\u0026current, \u0026mut dfs_stack, \u0026fully_visited);\n            }\n        }\n        // Reverse the result to get the correct order.\n        result.reverse();\n        result.retain(|node| node != exclude);\n        Ok(result)\n    }\n}\n\npub fn recalculate(sheet: \u0026mut Spreadsheet, topo_order: Vec\u003cString\u003e) {\n    for cell_key in topo_order {\n        if let Some(expr) = sheet.get_formula(\u0026cell_key) {\n            let result = eval_expr(expr, sheet);\n            match result {\n                Ok(val) =\u003e {\n                    if let Err(e) = sheet.set_by_key(\u0026cell_key, CellValue::Value(val)) {\n                        eprintln!(\"Error updating {}: {}\", cell_key, e);\n                    }\n                }\n                Err(_err) =\u003e {\n                    if let Err(e) = sheet.set_by_key(\u0026cell_key, CellValue::Error(())) {\n                        eprintln!(\"Error updating {}: {}\", cell_key, e);\n                    }\n                }\n            }\n        }\n    }\n}\n\n/// Recursively extract all cell references (non-range) from an expression and add them to `refs`.\npub fn extract_cell_refs(expr: \u0026Expr, refs: \u0026mut HashSet\u003cString\u003e) {\n    match expr {\n        Expr::Constant(_) =\u003e {}\n        Expr::CellRef(cell) =\u003e {\n            refs.insert(cell_to_string(cell));\n        }\n        Expr::BinaryOp(lhs, _op, rhs) =\u003e {\n            extract_cell_refs(lhs, refs);\n            extract_cell_refs(rhs, refs);\n        }\n        Expr::FunctionCall(_, arg) =\u003e {\n            extract_cell_refs(arg, refs);\n        }\n        Expr::Range(start, end) =\u003e {\n            refs.insert(cell_to_string(start));\n            refs.insert(cell_to_string(end));\n        }\n    }\n}\n\npub fn extract_range_refs(expr: \u0026Expr, range_refs: \u0026mut HashSet\u003cRangeRef\u003e) {\n    match expr {\n        Expr::Range(start, end) =\u003e {\n            range_refs.insert(RangeRef {\n                start: start.clone(),\n                end: end.clone(),\n            });\n        }\n        Expr::BinaryOp(lhs, _op, rhs) =\u003e {\n            extract_range_refs(lhs, range_refs);\n            extract_range_refs(rhs, range_refs);\n        }\n        Expr::FunctionCall(_, arg) =\u003e {\n            extract_range_refs(arg, range_refs);\n        }\n        _ =\u003e {}\n    }\n}\n\npub fn cell_to_string(cell: \u0026CellRef) -\u003e String {\n    let mut col = cell.col;\n    let mut col_str = String::new();\n    while col \u003e 0 {\n        let rem = ((col - 1) % 26) as u8;\n        col_str.insert(0, (b'A' + rem) as char);\n        col = (col - 1) / 26;\n    }\n    format!(\"{}{}\", col_str, cell.row)\n}\n","traces":[{"line":14,"address":[657712],"length":1,"stats":{"Line":1}},{"line":15,"address":[657731],"length":1,"stats":{"Line":1}}     }\n    }\n\n    pub fn get_formula(\u0026self, key: \u0026str) -\u003e Option\u003c\u0026crate::command::Expr\u003e {\n        self.formulas.get(key)\n    }\n\n    pub fn set_formula(\u0026mut self, key: \u0026str, expr: crate::command::Expr) {\n        self.formulas.insert(key.to_string(), expr);\n    }\n\n    /// Updates a cell’s value based on its key.\n    /// This function computes the index from the key (e.g., \"A1\") and updates that cell.\n    pub fn set_by_key(\u0026mut self, key: \u0026str, value: CellValue) -\u003e Result\u003c(), String\u003e {\n        let (row, col) = Self::cell_key_to_index(key)?;\n        let idx = row * self.cols + col;\n        if idx \u003c self.cells.len() {\n            self.cells[idx] = value;\n            Ok(())\n        } else {\n            Err(format!(\"Cell {} is out of bounds\", key))\n        }\n    }\n\n    /// Helper: converts a cell key like \"A1\" to 0-based row and col indices.\n    pub fn cell_key_to_index(key: \u0026str) -\u003e Result\u003c(usize, usize), String\u003e {\n        // Split the key into the column letters and the row number.\n        let mut col_part = String::new();\n        let mut row_part = String::new();\n        for ch in key.chars() {\n            if ch.is_ascii_alphabetic() {\n                col_part.push(ch);\n            } else if ch.is_ascii_digit() {\n                row_part.push(ch);\n            } else {\n                return Err(format!(\"Invalid character in cell key: {}\", ch));\n            }\n        }\n        if col_part.is_empty() || row_part.is_empty() {\n            return Err(format!(\"Invalid cell key format: {}\", key));\n        }\n        let mut col = 0;\n        for ch in col_part.chars() {\n            col = col * 26 + (ch.to_ascii_uppercase() as usize) - ('A' as usize) + 1;\n        }\n        let row: usize = row_part\n            .parse::\u003cusize\u003e()\n            .map_err(|_| format!(\"Invalid row in cell key: {}\", key))?\n            - 1;\n        Ok((row, col - 1))\n    }\n\n    fn index(\u0026self, row: usize, col: usize) -\u003e Option\u003cusize\u003e {\n        if row \u003c self.rows \u0026\u0026 col \u003c self.cols {\n            Some(row * self.cols + col)\n        } else {\n            None\n        }\n    }\n\n    pub fn get(\u0026self, row: usize, col: usize) -\u003e Option\u003c\u0026CellValue\u003e {\n        self.index(row, col).map(|idx| \u0026self.cells[idx])\n    }\n\n    pub fn set(\u0026mut self, row: usize, col: usize, value: CellValue) -\u003e Result\u003c(), String\u003e {\n        if let Some(idx) = self.index(row, col) {\n            self.cells[idx] = value;\n            Ok(())\n        } else {\n            Err(\"Index out of bounds\".to_string())\n        }\n    }\n\n    pub fn display_spreadsheet(\u0026self, start_row: usize, start_col: usize) {\n        let end_row = (start_row + 10).min(self.rows);\n        let end_col = (start_col + 10).min(self.cols);\n\n        // Print column headers (A, B, C, ...)\n        print!(\"\\t\");\n        for col in start_col..end_col {\n            print!(\"{}\\t\", Spreadsheet::convert_to_column_name(col as u16));\n        }\n        println!();\n\n        // Print each row, starting with its 1-indexed row number.\n        for row in start_row..end_row {\n            print!(\"{}\\t\", row + 1);\n            for col in start_col..end_col {\n                let idx = row * self.cols + col;\n                let cell_display = match self.cells.get(idx) {\n                    Some(CellValue::Value(v)) =\u003e v.to_string(),\n                    Some(CellValue::Error(())) =\u003e \"ERR\".to_string(),\n                    None =\u003e \"err\".to_string(),\n                };\n                print!(\"{}\\t\", cell_display);\n            }\n            println!();\n        }\n    }\n\n    pub fn scroll_spreadsheet(\u0026mut self, direction: char) -\u003e Result\u003c(), String\u003e {\n        let display_rows = 10;\n        let display_cols = 10;\n\n        match direction {\n            'w' =\u003e {\n                if self.scroll_row \u003e= display_rows {\n                    self.scroll_row -= display_rows;\n                } else {\n                    self.scroll_row = 0;\n                }\n            }\n            's' =\u003e {\n                self.scroll_row =\n                    (self.scroll_row + display_rows).min(self.rows.saturating_sub(display_rows));\n            }\n            'a' =\u003e {\n                if self.scroll_col \u003e= display_cols {\n                    self.scroll_col -= display_cols;\n                } else {\n                    self.scroll_col = 0;\n                }\n            }\n            'd' =\u003e {\n                self.scroll_col =\n                    (self.scroll_col + display_cols).min(self.cols.saturating_sub(display_cols));\n            }\n            _ =\u003e return Err(\"Invalid direction\".to_string()),\n        }\n        Ok(())\n    }\n\n    pub fn scroll_to(\u0026mut self, cell: \u0026str) -\u003e Result\u003c(), String\u003e {\n        if let Some((row, col)) = Spreadsheet::cell_string_to_indices(cell) {\n            if row \u003c self.rows \u0026\u0026 col \u003c self.cols {\n                self.scroll_row = row;\n                self.scroll_col = col;\n                Ok(())\n            } else {\n                Err(\"Cell reference out of bounds\".to_string())\n            }\n        } else {\n            Err(\"Invalid cell reference format\".to_string())\n        }\n    }\n\n    pub fn cell_string_to_indices(cell: \u0026str) -\u003e Option\u003c(usize, usize)\u003e {\n        if cell.is_empty() || !cell.chars().next()?.is_alphabetic() {\n            return None;\n        }\n\n        let mut col = 0usize;\n        let mut i = 0;\n        let chars: Vec\u003cchar\u003e = cell.chars().collect();\n\n        while i \u003c chars.len() \u0026\u0026 chars[i].is_alphabetic() {\n            col = col * 26 + (chars[i].to_ascii_uppercase() as usize - 'A' as usize + 1);\n            i += 1;\n        }\n\n        if col == 0 || i == chars.len() || !chars[i].is_ascii_digit() {\n            return None;\n        }\n\n        let mut row = 0usize;\n        while i \u003c chars.len() \u0026\u0026 chars[i].is_ascii_digit() {\n            row = row * 10 + (chars[i] as usize - '0' as usize);\n            i += 1;\n        }\n\n        if i != chars.len() {\n            return None;\n        }\n\n        Some((row - 1, col - 1))\n    }\n\n    pub fn convert_to_column_name(mut col: u16) -\u003e String {\n        let mut name = String::new();\n        loop {\n            let rem = col % 26;\n            name.insert(0, (b'A' + rem as u8) as char);\n            if col \u003c 26 {\n                break;\n            }\n            col = (col / 26) - 1;\n        }\n        name\n    }\n}\n","traces":[{"line":10,"address":[163264],"length":1,"stats":{"Line":14}},{"line":24,"address":[569686,569376],"length":1,"stats":{"Line":14}},{"line":25,"address":[525274,525385],"length":1,"stats":{"Line":14}},{"line":30,"address":[163433],"length":1,"stats":{"Line":14}},{"line":36,"address":[158960],"length":1,"stats":{"Line":5}},{"line":37,"address":[569730],"length":1,"stats":{"Line":5}},{"line":40,"address":[525616,525786,525811],"length":1,"stats":{"Line":4}},{"line":41,"address":[694226,694154],"length":1,"stats":{"Line":8}},{"line":46,"address":[694336],"length":1,"stats":{"Line":2}},{"line":47,"address":[525890,526032],"length":1,"stats":{"Line":2}},{"line":48,"address":[570245,570316,570155],"length":1,"stats":{"Line":4}},{"line":49,"address":[694660,694889],"length":1,"stats":{"Line":4}},{"line":50,"address":[159743],"length":1,"stats":{"Line":2}},{"line":51,"address":[570566],"length":1,"stats":{"Line":2}},{"line":53,"address":[570332,570486],"length":1,"stats":{"Line":4}},{"line":58,"address":[696793,694960],"length":1,"stats":{"Line":2}},{"line":60,"address":[623663],"length":1,"stats":{"Line":4}},{"line":61,"address":[164524],"len
